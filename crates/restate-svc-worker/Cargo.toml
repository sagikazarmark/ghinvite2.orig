[package]
name = "restate-svc-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# This crate is the Cloudflare Workers entry point for the Restate service
# binary. The whole crate exists only on wasm32 — `worker`,
# `console_error_panic_hook`, `tracing-wasm`, and the wasm32-only D1 backing in
# `storage-d1` are gated to wasm32. On native (`cargo check --workspace`) the
# lib.rs itself is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
base64.workspace = true
github.workspace = true
restate-sdk.workspace = true
restate-svc.workspace = true
storage.workspace = true
storage-d1.workspace = true
worker = { version = "0.8", features = ["d1", "http"] }
console_error_panic_hook = "0.1.7"
http = "1"
http-body-util = "0.1"
tracing-wasm = "0.2"
