[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-suite = ["dep:rand", "dep:rand_chacha"]

[dependencies]
async-trait.workspace = true
audit.workspace = true
chrono.workspace = true
domain.workspace = true
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true

# sqlx is native-only — wasm32 uses D1Storage (crates/storage-d1)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx.workspace = true

# getrandom needs wasm_js backend on wasm32 (pulled in transitively via ulid → rand_core)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
storage = { path = ".", features = ["test-suite"] }
rand.workspace = true
rand_chacha.workspace = true
tokio.workspace = true
