[package]
name = "ghinvite-workflows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ghinvite-workflows"
path = "src/main.rs"

[features]
integration = ["dep:ghinvite-web", "dep:axum", "ghinvite-github/test-stub"]

[dependencies]
async-trait.workspace = true
restate-sdk.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
ghinvite-core.workspace = true
ghinvite-github.workspace = true
rand.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The native binary (src/main.rs) wires up SqlxStorage and serves the endpoint
# over restate-sdk's hyper HTTP server; the Workers build
# (ghinvite-workflows-worker) wires up D1Storage and drives the endpoint via
# the `worker` runtime instead. `http_server` pulls tokio's `net`/mio, which
# does not compile on wasm32 — keep it native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true, optional = true }
ghinvite-web = { workspace = true, optional = true }
ghinvite-storage-sqlx.workspace = true
restate-sdk = { workspace = true, features = ["http_server"] }
tokio.workspace = true

[dev-dependencies]
hmac.workspace = true
ghinvite-github = { workspace = true, features = ["test-mock"] }
ghinvite-core = { workspace = true, features = ["test-suite"] }
ghinvite-storage-sqlx = { workspace = true, features = ["test-util"] }
rand_chacha.workspace = true
reqwest.workspace = true
restate-sdk = { workspace = true, features = ["http_server"] }
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
