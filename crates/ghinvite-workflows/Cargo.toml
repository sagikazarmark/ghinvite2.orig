[package]
name = "ghinvite-workflows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Handler services only. The two deployment shapes live in their own crates —
# `ghinvite-workflows-server` (native: tokio + SqlxStorage + restate-sdk's
# hyper server) and `ghinvite-workflows-worker` (Workers: D1Storage) — so
# nothing here needs a `cfg(target_arch)` to pick a runtime.

[features]
# Native-only: runs the handlers against the local `restate-server`
# (compose.yaml) via `scripts/test-restate.sh`. Never enabled for the Workers
# build, which is why `axum` and `ghinvite-web` can be plain optional deps.
integration = ["dep:ghinvite-web", "dep:axum", "ghinvite-github/test-stub"]

[dependencies]
async-trait.workspace = true
axum = { workspace = true, optional = true }
ghinvite-web = { workspace = true, optional = true }
restate-sdk.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
ghinvite-core.workspace = true
ghinvite-github.workspace = true
rand.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

# `http_server` pulls tokio's `net`/mio and belongs to the native deployment
# shape, so it is enabled by `ghinvite-workflows-server` and by this crate's
# own tests — never by the library itself.
[dev-dependencies]
hmac.workspace = true
ghinvite-github = { workspace = true, features = ["test-mock"] }
ghinvite-core = { workspace = true, features = ["test-suite"] }
ghinvite-storage-sqlx = { workspace = true, features = ["test-util"] }
rand_chacha.workspace = true
reqwest.workspace = true
restate-sdk = { workspace = true, features = ["http_server"] }
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
