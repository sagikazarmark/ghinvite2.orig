[package]
name = "ghinvite-workflows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Handler services only. The two deployment shapes live in their own crates —
# `ghinvite-workflows-server` (native: tokio + SqlxStorage + restate-sdk's
# hyper server) and `ghinvite-workflows-worker` (Workers: D1Storage) — so
# nothing here needs a `cfg(target_arch)` to pick a runtime.

[features]
runtime-tests = []
# Native-only: runs the handlers against the local `restate-server`
# (compose.yaml) via `scripts/test-restate.sh`. Never enabled for the Workers
# build. The suites' `axum` and `ghinvite-web` are dev-dependencies: only the
# test targets use them.
integration = []

[dependencies]
async-trait.workspace = true
restate-sdk.workspace = true
# The EdDSA-only jsonwebtoken provider for Restate request identity
# (`src/request_jwt.rs`).
ed25519-dalek.workspace = true
jsonwebtoken.workspace = true
web-time = "1.1"
chrono.workspace = true
ghinvite-core.workspace = true
ghinvite-email-vault.workspace = true
ghinvite-github.workspace = true
octoscrub.workspace = true
octotoken.workspace = true
rand.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

# `http_server` pulls tokio's `net`/mio and belongs to the native deployment
# shape, so it is enabled by `ghinvite-workflows-server` and by this crate's
# own tests — never by the library itself.
[dev-dependencies]
axum.workspace = true
ghinvite-web.workspace = true
kekring.workspace = true
# Signed Restate requests in `endpoint_identity`'s tests.
base64.workspace = true
bs58 = "0.5"
http = "1"
# Restate payload encodings in the PD-8 journal tests.
bytes = "1"
ghinvite-e2e = { path = "../ghinvite-e2e" }
hmac.workspace = true
ghinvite-github = { workspace = true, features = ["test-mock"] }
octoauth.workspace = true
ghinvite-core = { workspace = true, features = ["test-suite"] }
ghinvite-storage-sqlx = { workspace = true, features = ["test-util"] }
rand_chacha.workspace = true
reqwest.workspace = true
restate-sdk = { workspace = true, features = ["http_server"] }
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower.workspace = true
tower-sessions = { workspace = true, features = ["memory-store"] }

# The GitHub emulator's fault rules in the integration suites (GE-07);
# native only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
octoemu.workspace = true
