[package]
name = "github"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `test-mock` exposes the in-process `MockTransport` so other workspace crates
# (notably `restate-svc` in Plan 3) can write hermetic tests against the GitHub
# clients without spinning up an HTTP server.
test-mock = []
# `wiremock-tests` enables an optional integration test that runs the
# installation client against a real local HTTP server. Off by default so
# `cargo test --workspace` stays hermetic and fast.
wiremock-tests = ["dep:wiremock"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
domain.workspace = true
hmac.workspace = true
oauth2.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
url.workspace = true
wiremock = { workspace = true, optional = true }

[dev-dependencies]
github = { path = ".", features = ["test-mock"] }
jsonwebtoken = { workspace = true, features = ["use_pem"] }   # used to *verify* the JWTs we mint, not to sign them
tokio.workspace = true
wiremock.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `getrandom`'s `js` / `wasm_js` features are required on wasm32-unknown-unknown
# so `rsa` key-gen / `oauth2` state tokens can pull from
# `crypto.getRandomValues()`. We pin both major versions because both appear
# transitively (e.g. `rand_core@0.9` pulls 0.3, while `rsa` etc. still pull 0.2).
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
