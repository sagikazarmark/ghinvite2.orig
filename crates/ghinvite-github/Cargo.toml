[package]
name = "ghinvite-github"
description = "ghinvite's GitHub REST client: transport, typed endpoints and fixtures"
rust-version = "1.91"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Moved from gh-toolkit (GM-01) and trimmed to what ghinvite uses. Credentials
# come from octoauth; this crate never mints or caches a token itself.

[features]
# In-process `MockTransport` and credential builders for other crates' tests.
test-mock = []
# Native fake-GitHub HTTP fixture (`stub::router`) and the `stub` example.
test-stub = ["dep:axum"]

[dependencies]
chrono.workspace = true
http = "1"
octoauth.workspace = true
# `send-wrapper`: `TokenSource` futures are `Send` on wasm32 too (PD-3).
octotoken = { workspace = true, features = ["send-wrapper"] }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
trait-variant = "0.1.3"
url.workspace = true
zeroize = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest.workspace = true
# The fixture binds native TCP listeners; keep it off the wasm graph.
axum = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = "0.3"
js-sys = "0.3"
send_wrapper = { version = "0.6", features = ["futures"] }
worker = "0.8"

[dev-dependencies]
futures-util = "0.3"
ghinvite-github = { path = ".", features = ["test-mock"] }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
# examples/stub.rs only:
clap = { version = "4", features = ["derive"] }

# The endpoint tests against the GitHub emulator (tests/emulator.rs). Native
# only, and a dev-dependency only: never in a wasm32 or production graph.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
octoemu.workspace = true

[[example]]
name = "stub"
required-features = ["test-stub"]
