[package]
name = "ghinvite-github"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `test-mock` exposes the in-process `MockTransport` so other workspace crates
# (notably `ghinvite-workflows`) can write hermetic tests against the GitHub
# clients without spinning up an HTTP server.
test-mock = []
test-stub = ["dep:axum"]
# `wiremock-tests` enables an optional integration test that runs the
# installation client against a real local HTTP server. Off by default so
# `cargo test --workspace` stays hermetic and fast.
wiremock-tests = ["dep:wiremock"]

[dependencies]
axum = { workspace = true, optional = true }
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
ghinvite-core.workspace = true
oauth2.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
wiremock = { workspace = true, optional = true }

[dev-dependencies]
ghinvite-github = { path = ".", features = ["test-mock"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto", "use_pem"] }   # used to *verify* the JWTs we mint, not to sign them
tokio.workspace = true
wiremock.workspace = true
# examples/stub.rs only:
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `getrandom`'s `js` / `wasm_js` features are required on wasm32-unknown-unknown
# so `rsa` key-gen / `oauth2` state tokens can pull from
# `crypto.getRandomValues()`. We pin both major versions because both appear
# transitively:
#   * `getrandom 0.2` ← `oauth2 5`, `rsa 0.9`, and `rand_core 0.6` (via
#     `rand 0.8` → `ghinvite-core`/`rsa`/`oauth2`)
#   * `getrandom 0.3` ← `rand_core 0.9` (via `rand 0.9` → `ulid 1.2` →
#     `ghinvite-core`)
# The 0.3 line additionally needs `--cfg getrandom_backend="wasm_js"` (set in
# the workspace-root `.cargo/config.toml`).
# Re-validate after `ulid` / `rand` bumps: `cargo tree -p ghinvite-github -i
# getrandom@0.2` and `cargo tree -p ghinvite-github -i getrandom@0.3`.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# examples/stub.rs — standalone fake-GitHub server used by the ghinvite-workflows
# integration tests and local dev (enable `--features test-stub`).
[[example]]
name = "stub"
required-features = ["test-stub"]
