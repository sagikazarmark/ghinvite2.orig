[package]
name = "ghinvite-storage-d1"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
ghinvite-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["d1"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[features]
default = []
native-bridge = ["dep:reqwest"]
# HTTP loopback is a fixture-only configuration, never enabled by the server.
bridge-test = ["native-bridge"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }

[dev-dependencies]
ghinvite-core = { workspace = true, features = ["test-suite"] }
tokio.workspace = true
