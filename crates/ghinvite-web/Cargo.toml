[package]
name = "ghinvite-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Router, handlers and views only — no runtime, no storage backend. The two
# deployment shapes that supply those are `ghinvite-web-server` (native) and
# `ghinvite-web-worker` (Cloudflare Workers).
#
# `axum` appears once here, without the `tokio` feature: the native binary
# enables it in its own manifest, so this crate no longer has to list axum
# twice to work around Cargo unioning feature sets.

[dependencies]
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tracing", "matched-path", "query"] }
base64.workspace = true
chrono.workspace = true
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# Runs the shared form model's validators on the server (ADR 0001). Dioxus-free;
# the `dioform` facade must never appear here.
dioform-core.workspace = true
dioxus.workspace = true
dioxus-ssr.workspace = true
ghinvite-core.workspace = true
ghinvite-github.workspace = true
ghinvite-ui.workspace = true
hex = "0.4"
octoevents.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_qs.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tower.workspace = true
tower-http.workspace = true
tower-sessions.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# Platform shims, not deployment wiring: these patch over what
# wasm32-unknown-unknown lacks for code that runs identically on both targets,
# so they stay with the library rather than moving to `ghinvite-web-worker`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Covers both our deadlines and Tower's clock calls; std::SystemTime panics
# on wasm32-unknown-unknown without time's JS-backed implementation.
time = { version = "0.3", features = ["wasm-bindgen"] }
send_wrapper = { version = "0.6", features = ["futures"] }

# The native deployment's pieces are dev-dependencies now: the tests exercise
# this crate the way `ghinvite-web-server` deploys it. A dev-dependency cycle
# back onto a dependent crate is legal and does not affect the library build.
[dev-dependencies]
axum = { workspace = true, features = ["tokio"] }
ghinvite-github = { workspace = true, features = ["test-mock"] }
ghinvite-core = { workspace = true, features = ["test-suite"] }
ghinvite-storage-sqlx = { workspace = true, features = ["test-util"] }
ghinvite-web-server.workspace = true
http-body-util = "0.1"
sqlx.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["fs"] }
tower-sessions = { workspace = true, features = ["axum-core", "memory-store"] }
hmac.workspace = true
sha2.workspace = true
# Captures `tracing` output so the disclosure tests can assert on what an
# operator would actually see.
tracing-subscriber.workspace = true
hex = "0.4"
wiremock.workspace = true
