[package]
name = "ghinvite-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# View components only (ADR 0001). This crate must stay free of server
# dependencies — no axum, tower, tower-sessions, reqwest, the GitHub client,
# or either storage crate — because a browser-side island builds it for
# wasm32-unknown-unknown, where the rest of the workspace's
# `cfg(target_arch = "wasm32")` gates mean "Cloudflare Workers". Check it on
# its own with `cargo check -p ghinvite-ui --target wasm32-unknown-unknown`;
# never `--workspace --target wasm32-unknown-unknown`.
[dependencies]
chrono.workspace = true
# The shared form model (ADR 0001): `dioform-core` is Dioxus-free and runs the
# validators on the server; `dioform-derive` generates the typed field paths.
# The `dioform` facade (browser bindings) is deliberately NOT a dependency here
# — the island that needs it depends on this crate, not the other way round.
dioform-core.workspace = true
dioform-derive.workspace = true
dioxus.workspace = true
dioxus-field = { version = "0.7.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "bf007c15d0cf4d04d3181cc46cf12325aa773955", version = "0.0.1", default-features = false, features = ["router"] }
ghinvite-core.workspace = true
serde.workspace = true
# Serialises the island props blob (`link_form::LinkFormIslandProps`).
serde_json.workspace = true

# SSR is only needed to assert on rendered markup in this crate's tests. The
# production renderer lives in `ghinvite-web` (`views::render`).
[dev-dependencies]
dioxus-ssr.workspace = true
