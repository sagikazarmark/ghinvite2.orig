[package]
name = "ghinvite-web-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# This crate is the Cloudflare Workers entry point for the web binary. The
# whole crate exists only on wasm32 — `worker`, `console_error_panic_hook`,
# `tracing-wasm`, and the wasm32-only D1 backing in `ghinvite-storage-d1` are gated to
# wasm32. On native (`cargo check --workspace`) the lib.rs itself is empty.
[target.'cfg(target_arch = "wasm32")'.dependencies]
async-trait.workspace = true
# Mirror `crates/ghinvite-web/Cargo.toml`: axum without the `tokio` feature so we don't
# pull in mio/tokio-net on wasm32.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tracing", "matched-path", "query"] }
ghinvite-github.workspace = true
serde_json.workspace = true
ghinvite-core.workspace = true
ghinvite-storage-d1.workspace = true
tower.workspace = true
tower-sessions.workspace = true
ghinvite-web.workspace = true
# `http` feature exposes `worker::HttpRequest` and the `From<http::Response>`
# conversions used to return an axum response.
worker = { version = "0.8", features = ["d1", "axum", "http"] }
console_error_panic_hook = "0.1.7"
hex = "0.4"
tracing-wasm = "0.2"
