[package]
name = "ghinvite-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum.workspace = true
base64.workspace = true
ghinvite-config.workspace = true
# `test-stub` is no longer used here (GE-07 moved the suites to octoemu); it
# keeps the stub's own tests in `cargo test --workspace` until GE-09 deletes
# the stub.
ghinvite-github = { workspace = true, features = ["test-stub"] }
restate-e2e-harness = "0.4"
restate-sdk = { workspace = true, features = ["http_server"] }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
ulid.workspace = true

# The GitHub emulator the harness serves (GE-07); native only, and this
# crate is test support no production crate depends on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
octoemu.workspace = true
