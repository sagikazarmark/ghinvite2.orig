[package]
name = "ghinvite-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
ghinvite-config.workspace = true
# `test-mock`: `ReqwestTransport::with_client` for `github_transport`.
ghinvite-github = { workspace = true, features = ["test-mock"] }
restate-e2e-harness = "0.4"
restate-sdk = { workspace = true, features = ["http_server"] }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
ulid.workspace = true

# The GitHub emulator the harness serves (GE-07); native only, and this
# crate is test support no production crate depends on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
octoemu.workspace = true
