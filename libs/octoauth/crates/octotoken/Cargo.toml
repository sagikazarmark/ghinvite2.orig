[package]
name = "octotoken"
description = "Cached GitHub App installation tokens behind a consumer-facing provider trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# `DynInstallationTokenProvider` futures are `Send` on wasm32 too, wrapped in
# `send_wrapper::SendWrapper` (for hosts such as Restate's `ctx.run` that
# demand `Send`; a Worker isolate is single-threaded). No effect natively.
send-wrapper = ["dep:send_wrapper"]

[dependencies]
octoauth.workspace = true
thiserror.workspace = true

# Combining concurrent token creation is native-only: on Workers a request must never
# wait on another request's I/O.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = { workspace = true, features = ["std"] }

# The provider's clock reads JavaScript `Date.now()` on Workers.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { workspace = true, optional = true }

[dev-dependencies]
chrono.workspace = true
futures-util = { workspace = true, features = ["std"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
wiremock.workspace = true

# The examples' clients. Native only: the examples run as tests against a
# local GitHub stand-in.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# No `retry` and no `follow-redirect`: see examples/octocrab.rs.
octocrab = { workspace = true, features = ["default-client", "rustls", "rustls-ring", "timeout", "jwt-rust-crypto"] }

[[example]]
name = "octocrab"
test = true

[[example]]
name = "reqwest"
test = true
