[package]
name = "octoauth-octocrab"
description = "octocrab with octoauth's credentials: a client for the App's API, errors without upstream text, the 401 signals octoauth's retry helpers need"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A separate crate rather than a feature of octoauth: octocrab ships breaking
# minor releases every month or two, and only this crate's version has to
# follow them (ADR 0014 §5).
#
# Native only: octocrab on Workers needs its own transport, which is
# unverified (ADR 0014). On wasm32 the crate is empty, so a `--workspace`
# wasm32 check still passes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
octoauth.workspace = true
# `timeout` for the bounded connect and read times. No TLS, client or retry
# features: the application chooses them (see the crate docs).
octocrab = { workspace = true, features = ["timeout"] }
# `HeaderMap` for `unauthorized`; the same `http` 1 as octocrab and octoauth.
http.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
octocrab = { workspace = true, features = ["default-client", "rustls", "rustls-ring", "timeout"] }
serde_json.workspace = true
tokio.workspace = true
wiremock.workspace = true
