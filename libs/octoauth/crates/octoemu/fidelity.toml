# octoemu fidelity manifest: how far each implemented route and each modelled
# behaviour is known to match GitHub. Compiled into the crate; printed by
# `octoemu --fidelity` and served at `GET /__octoemu/fidelity`.
#
# Labels (docs/specs/github-emulator.md §3.5):
#   label = "verified"    date = "YYYY-MM-DD", scenario = "<id>"  set by the live suite
#   label = "documented"  doc = "https://…"                      GitHub documents it
#   label = "assumed"     reason = "…"                           a guess; refused in
#                                                                refuse-assumed mode
#
# [routes."METHOD /pattern"]: exactly one entry per route registered in
# src/api.rs, in axum's `{param}` syntax. A test (and Emulator::start) fails
# when a registered route has no entry or an entry names no registered route.
#
# [behaviours.<id>]: exactly one entry per cross-cutting behaviour listed in
# `api::BEHAVIOURS`, checked the same way.
#
# [scenarios]: each fidelity-suite scenario ID (crates/octoemu-conformance)
# with the entries it measures: route keys ("GET /app") and behaviour IDs.
# A live run that passes a scenario stamps those entries `verified` with its
# ID; `octoemu --fidelity` shows the scenarios per entry. The conformance
# crate's tests fail when its scenarios and this table disagree.

# Every unbuilt API and web route answers 501
# {"message": "octoemu: not implemented", "route": "<METHOD> <path>"}.

# --- App (JWT) routes --------------------------------------------------------

[routes."GET /app"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#get-the-authenticated-app"
# `events` sorted, `external_url` the seeded homepage URL (measured).

[routes."GET /app/installations"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#list-installations-for-the-authenticated-app"

[routes."GET /app/installations/{installation_id}"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#get-an-installation-for-the-authenticated-app"
# 404 for an unknown installation or another App's.

[routes."DELETE /app/installations/{installation_id}"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#delete-an-installation-for-the-authenticated-app"
# 204; installation.deleted (sent by the App's bot); its tokens stop working
# (token-revocation-immediate). 404 for an unknown installation or another
# App's.

[routes."POST /app/installations/{installation_id}/access_tokens"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#create-an-installation-access-token-for-an-app"
# 201 {token, expires_at, permissions (as asked), repository_selection,
# repositories?}; 404 unknown or another App's; 403 suspended; 422 a scope it
# cannot have. Errors name the old reference page as documentation_url
# (measured).

[routes."PUT /app/installations/{installation_id}/suspended"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#suspend-an-app-installation"

[routes."DELETE /app/installations/{installation_id}/suspended"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#unsuspend-an-app-installation"

[routes."GET /app/installation-requests"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#list-installation-requests-for-the-authenticated-app"

# --- Installation-token routes -----------------------------------------------

[routes."GET /installation/repositories"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/installations#list-repositories-accessible-to-the-app-installation"
# Needs metadata: read (as ghinvite-github's endpoint table declares). Only the
# token's repositories; paged.

[routes."DELETE /installation/token"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/installations#revoke-an-installation-access-token"
# 204; the token keeps working elsewhere for a moment
# (token-revocation-propagation); a second DELETE is 401 Bad credentials.

[routes."GET /user/installations/{installation_id}/repositories"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/installations#list-repositories-accessible-to-the-user-access-token"
# A GitHub App user access token, no App permission. 200 {total_count,
# repository_selection, repositories}, paged: the installation's repositories
# the user has explicit access to (a collaboration, ownership, an organization
# role or base permission, a team), each with the user's `permissions`
# booleans. 404 for an unknown installation or another App's. The rest is
# assumed: user-installations-pat, user-installation-access,
# user-installation-repository-selection.

[behaviours.user-installations-pat]
label = "assumed"
reason = "GET /user/installations/{installation_id}/repositories with a classic PAT: 403 'You must authenticate with an access token authorized to a GitHub App in order to list repositories'. The docs name only user access tokens and list a 403; the status for a PAT and the message (modelled on the community-reported one for GET /user/installations) are unmeasured. Refused in refuse-assumed mode."

[behaviours.user-installation-access]
label = "assumed"
reason = "Which of its App's installations a user access token reaches on GET /user/installations/{installation_id}/repositories beyond the documented intersection: a suspended installation is a 404; one where the user has explicit access to no repository is a 404, except for its account (the user, or an owner of the organization), which gets an empty list. Unmeasured. Refused in refuse-assumed mode when it applies."

[behaviours.user-installation-repository-selection]
label = "assumed"
reason = "GET /user/installations/{installation_id}/repositories reports `repository_selection`: the schema names the field (not required) without pinning its value; modelled as the installation's own (`all` or `selected`), as GET /installation/repositories reports it for an unnarrowed token. Left out in refuse-assumed mode."

[behaviours.date-header]
label = "documented"
doc = "https://www.rfc-editor.org/rfc/rfc9110#name-date"
# Every response carries `Date` (IMF-fixdate) from the virtual clock; octoauth
# reads it for JWT clock skew and token issued-at.

[behaviours.json-content-type]
label = "documented"
doc = "https://docs.github.com/en/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types"
# JSON bodies are `application/json; charset=utf-8`.

[behaviours.error-body]
label = "documented"
doc = "https://docs.github.com/en/rest/using-the-rest-api/troubleshooting-the-rest-api"
# Errors are {"message", "documentation_url"}. GitHub also sends `status`, the
# HTTP status as a string ("401"; measured 2026-11-24 on every error the
# fidelity suite records); octoemu leaves it out.

[behaviours.validation-errors]
label = "documented"
doc = "https://docs.github.com/en/rest/using-the-rest-api/troubleshooting-the-rest-api"
# 422 "Validation Failed" adds errors[{resource, field, code}].

[behaviours.unsupported-api-version]
label = "assumed"
reason = "An X-GitHub-Api-Version naming no supported version (2022-11-28, 2026-03-10) is a 400 {\"message\": \"Bad Request\", \"errors\": \"The version you specified in the \\\"X-GitHub-API-Version\\\" request header, \\\"<value>\\\", is not a supported version. The following versions are currently supported: \\\"2026-03-10\\\" (most recent) and \\\"2022-11-28\\\".\", \"documentation_url\": \"https://docs.github.com/rest\"} on every REST route, before the credential is checked; no header means the default version. The docs disagree (400 on the API versions page, 410 on the breaking-changes page). Measured once against GitHub (2026-11-24, scenario api-version-unsupported): 400 for a version never served, a future one and a malformed one, with and without a credential. Refused in refuse-assumed mode."

[behaviours.rate-limit-headers]
label = "assumed"
reason = "The x-ratelimit-* header names are documented; the values are a fixed stub (5000 limit, 5000 remaining, core, reset in 1 h) until per-credential budgets are modelled. Omitted in refuse-assumed mode."

[behaviours.secondary-rate-limit]
label = "assumed"
reason = "Not modelled: octoemu never applies a secondary rate limit of its own; a fault rule injects one, in whatever shape the test gives (ghinvite's suites use 403 with Retry-After). GitHub's shape (403 or 429, which headers, the message) is unmeasured; scenario secondary-limit-shape (live, destructive) records it. A label only: nothing is refused."

[behaviours.request-id-header]
label = "assumed"
reason = "GitHub sends X-GitHub-Request-Id on REST responses; the value is opaque and octoemu's format (port:pid:sequence) is its own. Omitted in refuse-assumed mode."

# --- Authentication (GE-02) ----------------------------------------------------

[behaviours.app-jwt]
label = "documented"
doc = "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-json-web-token-jwt-for-a-github-app"
# `Authorization: Bearer <jwt>`, RS256, verified against any of the App's
# registered keys; `iss` is the client ID or the App ID (string or number);
# `iat` required; `exp` required, in the future and at most 10 minutes ahead
# of the virtual clock. Rejections are 401. A JWT sent with the `token`
# scheme is refused (the page says Bearer). Measured 2026-11-24
# (jwt-error-matrix): an `iat` given as a numeric string is accepted, so
# octoemu reads `iat` and `exp` as a JSON integer or a string of one.

[behaviours.jwt-error-messages]
label = "assumed"
reason = "The 401 texts are not documented. Measured once against GitHub (2026-11-24, scenarios jwt-error-matrix and jwt-skew-tolerance): 'Bad credentials' for a credential that is not a JWT, alg none, a missing or past exp and an iat 300 s ahead; 'A JSON web token could not be decoded' for a signature no registered key verifies, an installation token on a JWT route and a JWT sent with the token scheme; \"'Issuer' claim ('iss') must be an Integer\" for an iss that is no client ID (and not a number); \"Missing 'issued at' claim ('iat') in assertion\"; \"'Expiration time' claim ('exp') is too far in the future\". Community-reported, unmeasured: 'Integration not found' (a numeric iss naming no App), the 'Issued at' claim ('iat') must be an Integer… text (a non-numeric iat) and the 'Expiration time' claim ('exp') must be a numeric value… text (a non-numeric exp). Replaced by 'octoemu: assumed message withheld' in refuse-assumed mode."

[behaviours.jwt-iat-tolerance]
label = "assumed"
reason = "An iat up to 60 s in the future (jwt::IAT_FUTURE_TOLERANCE) is accepted, for a client clock slightly ahead; more is 401 Bad credentials. Measured once against GitHub (2026-11-24, scenario jwt-skew-tolerance): an iat 0, 10, 25, 45 and 60 s ahead of GitHub's Date was accepted, 300 s ahead refused; 60 s is the strictest bound that allows. A JWT accepted only thanks to it is refused in refuse-assumed mode."

[behaviours.jwt-exp-after-iat]
label = "assumed"
reason = "exp is bounded by the current time only, not by iat: an exp more than 600 s after iat is accepted while it is within 10 minutes of now. Measured once against GitHub (2026-11-24, scenario jwt-error-matrix: iat 120 s back, exp 540 s ahead, accepted), contradicting the community report that GitHub rejects it. A JWT accepted although exp is more than 600 s after iat is refused in refuse-assumed mode."

[behaviours.bad-credentials]
label = "documented"
doc = "https://docs.github.com/en/rest/using-the-rest-api/troubleshooting-the-rest-api"
# An unknown, malformed or expired token is 401 {"message": "Bad credentials"}:
# installation tokens, user access tokens (ghu_), classic PATs (ghp_); any
# other prefix (gho_, github_pat_, a ghr_ refresh token) matches nothing.

[behaviours.requires-authentication]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/installations#list-repositories-accessible-to-the-app-installation"
# No credential on a route that needs one: 401 "Requires authentication".

[behaviours.wrong-credential-kind]
label = "assumed"
reason = "A credential of the wrong kind (an installation token on a JWT route, a JWT on an installation-token route) is a 401, with 'A JSON web token could not be decoded' on JWT routes and 'Bad credentials' elsewhere. Measured once against GitHub (2026-11-24, scenario jwt-error-matrix) for GET /app and GET /repos/{owner}/{repo}; other routes might answer 403 ('You must authenticate with an installation access token…'), unmeasured. Refused in refuse-assumed mode."

[behaviours.permission-enforcement]
label = "documented"
doc = "https://docs.github.com/en/rest/using-the-rest-api/troubleshooting-the-rest-api"
# A token without the route's permission: 403 "Resource not accessible by
# integration" with X-Accepted-GitHub-Permissions: <permission>=<level>.
# Per-route permissions follow
# https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps

[behaviours.private-resource-404]
label = "documented"
doc = "https://docs.github.com/en/rest/using-the-rest-api/troubleshooting-the-rest-api"
# A private resource the caller cannot reach is a 404, never a 403
# (auth::visible_repo; used by the repository routes from GE-03).

# --- Installation tokens (GE-02) ------------------------------------------------

[behaviours.installation-token-expiry]
label = "documented"
doc = "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-an-installation-access-token-for-a-github-app"
# Tokens expire one hour after creation, on the virtual clock; an expired
# token is 401 "Bad credentials".

[behaviours.installation-token-format]
label = "assumed"
reason = "ghs_<APPID>_<JWT>, 383 characters, follows GitHub's stateless-token rollout (https://github.blog/changelog/2026-10-02-stateless-github-app-installation-tokens-rolled-out/). Measured against GitHub (2026-11-24, scenario token-revocation-delete): the prefix, the App ID as the second segment, a JWT after it and 383 characters on every token minted that day (the changelog's 'about 520' did not hold). The inner JWT (HS256 with a per-instance key; claims iss, app_id, installation_id, jti, iat, exp, pad) is octoemu's own. Informational: clients must treat tokens as opaque, so nothing is refused for it."

[behaviours.installation-token-scope]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/apps#create-an-installation-access-token-for-an-app"
# `permissions` narrows and never widens; `repositories` (names) and
# `repository_ids` narrow to repositories the installation can access, at
# most 500 (each is checked first: measured, 501 unknown IDs are refused as
# inaccessible); the response has permissions (exactly those asked, measured),
# repository_selection and, when narrowed, repositories. Tokens are looked up
# on every call.

[behaviours.token-error-messages]
label = "assumed"
reason = "The 422 texts for a scope a token cannot have are not documented. Measured once against GitHub (2026-11-24, scenario token-downscoping-errors): 'The permissions requested are not granted to this installation.' (a permission the installation lacks), 'The level of access for permissions requested are not granted to this installation.' (a higher level, a level the permission does not have) and 'There is at least one repository that does not exist or is not accessible to the parent installation.' (an unknown repository, 501 unknown repository IDs). Invented: a Validation Failed with a custom error for over 500 accessible repositories. Withheld in refuse-assumed mode."

[behaviours.token-repositories-union]
label = "assumed"
reason = "With both repositories and repository_ids, the token covers the union of both. Undocumented; refused in refuse-assumed mode."

[behaviours.token-implicit-metadata]
label = "assumed"
reason = "A token narrowed by permissions that omit metadata still holds metadata: read when the installation has it, so it can read the repositories it covers. Unmeasured; measured once against GitHub (2026-11-24, scenario token-downscoping-errors): the answer lists only the permissions asked ({members: read} answers {members: read}), and so does octoemu's. Refused in refuse-assumed mode when it applies."

[behaviours.token-revocation-immediate]
label = "assumed"
reason = "A token of an uninstalled installation (DELETE /app/installations/{installation_id}, or the admin uninstall) is refused (401 Bad credentials) on its next use. Whether GitHub rejects stateless tokens at once after an uninstall is unmeasured (plan §4 [M] scenario 3; scenario token-revocation-uninstall is destructive). Refused in refuse-assumed mode."

[behaviours.token-revocation-propagation]
label = "assumed"
reason = "A token revoked with DELETE /installation/token keeps working on every other route for 500 ms on the virtual clock (tokens::REVOCATION_PROPAGATION), then is 401 Bad credentials; a second DELETE /installation/token is 401 Bad credentials at once. Measured against GitHub (2026-11-24, scenario token-revocation-delete and two ad-hoc runs of it): a second DELETE was always 401 at once; of eight uses right after the DELETE, two were accepted (the later 0.41 s after it) and six refused (the earliest 0.11 s after it), and every use from 0.78 s on was refused. So revocation propagates within about a second, not at once; octoemu models the window GitHub may leave open. Refused in refuse-assumed mode: a revoked token's use answers the refusal."

[behaviours.token-narrowed-selection]
label = "assumed"
reason = "A token minted with permissions reports repository_selection: selected, whatever the installation's selection. Measured once against GitHub (2026-11-24, scenario token-downscoping-errors, {permissions: {members: read}} on an all-repositories installation); whether it depends on the permissions asked is unmeasured. GET /installation/repositories still reports the installation's selection for such a token. Left out of the answer in refuse-assumed mode."

[behaviours.suspended-installation]
label = "assumed"
reason = "Token creation for a suspended installation is the endpoint's documented 403; the message 'This installation has been suspended' is undocumented. Measured once against GitHub (2026-11-24, scenario suspended-installation): that message; suspending twice is 204 both times; GET /app/installations/{installation_id} shows suspended_at and suspended_by (the App's bot when it suspended itself), null again after unsuspending. Withheld in refuse-assumed mode."

[behaviours.suspended-installation-tokens]
label = "assumed"
reason = "Tokens minted before a suspension are refused while it lasts, with 403 'This GitHub App installation is currently suspended.' (not token creation's text), and work again after unsuspension. GitHub documents that access is blocked; measured once against GitHub (2026-11-24, scenario suspended-installation): the status, the message and both changes on the very next call. Refused in refuse-assumed mode."

[behaviours.pagination]
label = "documented"
doc = "https://docs.github.com/en/rest/using-the-rest-api/using-pagination-in-the-rest-api"
# per_page defaults to 30 and silently caps at 100; page from 1; Link with
# prev, next, last and first (absolute URLs on the request's Host).

# --- Repositories, collaborators and invitations (GE-03) -----------------------

[routes."GET /repos/{owner}/{repo}"]
label = "documented"
doc = "https://docs.github.com/en/rest/repos/repos#get-a-repository"
# metadata: read. An installation token or a user token (GE-05,
# user-token-permissions). A private or internal repository outside the
# token's reach is a 404 (private-resource-404).

[routes."GET /repos/{owner}/{repo}/collaborators"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/collaborators#list-repository-collaborators"
# metadata: read; paged; each user with `permissions` and `role_name`.
# `affiliation` beyond `direct` is the collaborator-affiliation behaviour.

[routes."PUT /repos/{owner}/{repo}/collaborators/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/collaborators#add-a-repository-collaborator"
# administration: write. 201 with the invitation, 204 for a user who already
# has access or a role change (collaborator-put-outcomes); 422 for an
# invalid permission or the invitation limit.

[routes."DELETE /repos/{owner}/{repo}/collaborators/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/collaborators#remove-a-repository-collaborator"
# administration: write; 204; member.removed.

[routes."GET /repos/{owner}/{repo}/collaborators/{username}/permission"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/collaborators#get-repository-permissions-for-a-user"
# metadata: read. `permission` (admin|write|read|none), `role_name` and
# `user`; the highest role across direct collaboration, ownership and the
# organization's owners and base permission (teams from GE-06).

[routes."GET /repos/{owner}/{repo}/invitations"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/invitations#list-repository-invitations"
# administration: read; paged. Link URLs: invitation-alias-links.

[routes."GET /repositories/{repository_id}/invitations"]
label = "assumed"
reason = "The repository-ID alias of the invitation list, which ghinvite's pagination follows when a Link points at it. GitHub serves /repositories/{id}/… aliases for repository routes, but this one is not documented. Same permission (administration: read) and body as the named route."

[routes."PATCH /repos/{owner}/{repo}/invitations/{invitation_id}"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/invitations#update-a-repository-invitation"
# administration: write; `permissions` is read, write, maintain, triage or
# admin (anything else 422); 200 with the invitation; 404 for another
# repository's invitation.

[routes."DELETE /repos/{owner}/{repo}/invitations/{invitation_id}"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/invitations#delete-a-repository-invitation"
# administration: write; 204.

# --- Users (GE-03) ---------------------------------------------------------------

[routes."GET /users/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/users/users#get-a-user"
# Public (any valid credential or none). Users, organizations and App bots
# ({slug}[bot], app-bot-account).

[routes."GET /user/{account_id}"]
label = "assumed"
reason = "Numeric user lookup as ghinvite spells it (its endpoint table flags the path UNVERIFIED). GitHub's docs describe 'Get a user using their ID' at this path; the live suite (GE-08) has not confirmed it. Same body as GET /users/{username}."

[routes."GET /avatars/u/{id}"]
label = "assumed"
reason = "avatars.githubusercontent.com/u/{id} is how GitHub's avatar_url points at an image, but the CDN is undocumented. octoemu answers a small PNG (image/png) for any seeded account or App bot, ignoring s and v, and 404 otherwise."

# --- Repository collaboration (GE-03) ----------------------------------------------

[behaviours.collaborator-put-outcomes]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/collaborators#add-a-repository-collaborator"
# 201 with the new invitation; 204 when an existing collaborator is added
# again or an organization member is added as an individual collaborator
# (who becomes a direct collaborator without an invitation); a role change
# of a collaborator is a 204. `permission` defaults to push.

[behaviours.user-repo-permission-ignored]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/collaborators#add-a-repository-collaborator"
# `permission` is only valid on organization-owned repositories: on a
# user's repository it is ignored and the collaborator gets push.

[behaviours.role-names]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/collaborators#get-repository-permissions-for-a-user"
# `permission` is the legacy admin|write|read|none (maintain is write,
# triage is read); `role_name` the exact role (read, triage, write,
# maintain, admin or a custom role's name). Invitation `permissions` use
# read|write|triage|maintain|admin. A custom role ranks as its base.

[behaviours.invitation-expiry]
label = "documented"
doc = "https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-personal-account-on-github/managing-access-to-your-personal-repositories/inviting-collaborators-to-a-personal-repository"
# An invitation expires 7 days after it was sent, on the virtual clock, and
# then reports expired: true.

[behaviours.invitation-limit]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/collaborators#add-a-repository-collaborator"
# At most 50 invitations to a repository per 24 hours (sliding, on the
# virtual clock, counting invitations sent through the API; deleting one
# does not give it back). Organization members added directly do not
# count. Beyond it: 422 (the body is repo-error-messages).

[behaviours.member-events]
label = "documented"
doc = "https://docs.github.com/en/webhooks/webhook-events-and-payloads#member"
# member.added when an invitee accepts ("accepted an invitation to a
# repository"), with changes.permission.to and changes.role_name.to;
# member.edited when a collaborator's role changes; member.removed when one
# is removed or leaves. Appended to the outbox for the installations that
# can access the repository and subscribe to `member` (GE-04 delivers).
# Which permission GitHub requires to deliver member events is an open
# documentation conflict (plan §4); octoemu does not filter by permission.

[behaviours.member-edited-changes]
label = "assumed"
reason = "member.edited carries changes {permission: {from, to}} with role names (read, write, …), no old_permission. Measured once against GitHub (2026-11-24, scenario member-edited-changes, read to write through the deliveries API). Left out of the payload in refuse-assumed mode."

[behaviours.member-added-directly]
label = "assumed"
reason = "An organization member added by PUT …/collaborators/{username} (204, no invitation) emits member.added with the sender being the App's bot. Whether GitHub announces it is unmeasured. Not emitted in refuse-assumed mode."

[behaviours.reput-pending-invitation]
label = "assumed"
reason = "PUT …/collaborators/{username} for a user with a pending invitation answers 201 with that same invitation (same ID and created_at) and keeps its permissions whatever the PUT asks (PATCH the invitation to change them); it does not count against the 50-per-day limit. Measured once against GitHub (2026-11-24, scenario reput-pending-invitation: invited read, re-PUT read then write, the reply and both invitation lists say read; one invitation, cancelled by its first ID); the limit is unmeasured. Refused in refuse-assumed mode."

[behaviours.reput-expired-invitation]
label = "assumed"
reason = "PUT …/collaborators/{username} for a user whose invitation has expired deletes it and sends a new one (201, new ID and created_at, counts against the limit). Unmeasured (plan §4 [M] scenario 9). Refused in refuse-assumed mode."

[behaviours.expired-invitations-listed]
label = "assumed"
reason = "An expired invitation stays in GET …/invitations with expired: true until it is deleted or replaced. Unmeasured (plan §4 [M] scenario 9). A list that would show one is refused in refuse-assumed mode."

[behaviours.accept-expired-invitation]
label = "assumed"
reason = "Accepting an expired invitation fails and leaves it in place (the admin act route answers 404 'octoemu: the invitation has expired'; GE-05's user route will map it). Unmeasured (plan §4 [M] scenario 9). Refused in refuse-assumed mode."

[behaviours.invitation-alias-links]
label = "assumed"
reason = "The invitation list's Link URLs point at /repositories/{repository_id}/invitations whichever path was asked, as ghinvite's pagination expects (crates/ghinvite-github/src/endpoints/invitation_alias.rs). GitHub's actual next-link form is unmeasured. A multi-page list on the named path is refused in refuse-assumed mode."

[behaviours.custom-role-invitation-permissions]
label = "assumed"
reason = "An invitation offering a custom repository role reports the role's name in `permissions` (the documented enum lists only the five built-in names). Rendering one is refused in refuse-assumed mode."

[behaviours.collaborator-affiliation]
label = "assumed"
reason = "affiliation=outside lists direct collaborators who are not members of the owning organization; all (the default) lists everyone with access through any source (direct, ownership, organization owners and base permission; teams from GE-06), each with their effective role. Only direct is relied on by ghinvite; the rest is unmeasured. Refused in refuse-assumed mode unless affiliation=direct."

[behaviours.permission-without-access]
label = "assumed"
reason = "GET …/collaborators/{username}/permission for a seeded user without access (including one with only a pending invitation) answers 200 {permission: none, role_name: none} with every flag false. Whether GitHub reports read on public repositories, or 404, is unmeasured. Refused in refuse-assumed mode."

[behaviours.remove-non-collaborator]
label = "assumed"
reason = "DELETE …/collaborators/{username} for a user who is not a direct collaborator answers 204 and changes nothing. Unmeasured. Refused in refuse-assumed mode."

[behaviours.unknown-user-404]
label = "assumed"
reason = "A collaborator route naming a login that is no user answers 404 Not Found. GitHub documents no 404 for PUT; unmeasured. Refused in refuse-assumed mode."

[behaviours.org-rename]
label = "documented"
doc = "https://docs.github.com/en/organizations/managing-organization-settings/renaming-an-organization"
# A renamed organization keeps its ID; members, teams, invitations and
# installations stay its own, and the old login no longer names it (admin
# POST /__octoemu/orgs/{org}/rename). Not modelled: GitHub's redirects for
# its repositories' old names (the emulator refuses to rename an owner of
# repositories).

[behaviours.user-rename]
label = "documented"
doc = "https://docs.github.com/en/account-and-profile/setting-up-and-managing-your-personal-account-on-github/managing-user-account-settings/changing-your-github-username"
# A renamed user keeps their ID; collaborations, memberships and invitations
# stay theirs, and the old login no longer names them (admin
# POST /__octoemu/users/{login}/rename). Not modelled: GitHub's redirects for
# a renamed owner's repositories (the emulator refuses to rename an owner).

[behaviours.outside-collaborator-policy]
label = "assumed"
reason = "An organization seeded `outside_collaborators_restricted` (GitHub's 'Allow repository administrators to invite outside collaborators' switched off) refuses an App's PUT /repos/{owner}/{repo}/collaborators/{username} for a user who is not an active member: 403 'Inviting outside collaborators is restricted by organization policy.' (the text ghinvite-github classifies; community-reported). Members and existing collaborators are unaffected; a re-PUT on a pending invitation is refused like a new one. Whether the policy reaches an App at all, the status (403 or 422) and the text are unmeasured; scenario outside-collaborator-policy. Refused in refuse-assumed mode."

[behaviours.out-of-scope-repository]
label = "assumed"
reason = "A public repository outside the installation token's repositories is visible (GET /repos/{owner}/{repo}) but its collaborator and invitation routes answer 403 Resource not accessible by integration with X-Accepted-GitHub-Permissions. Unmeasured. Refused in refuse-assumed mode."

[behaviours.repo-error-messages]
label = "assumed"
reason = "The 422 bodies of the repository routes are guesses: Validation Failed with errors [{resource: Repository, field: permission|permissions|affiliation, code: invalid}] for a value outside the documented set, and [{resource: Repository, field: base, code: custom, message: …50 invitations…}] for the invitation limit (plan §4 [M] scenario 10). Withheld in refuse-assumed mode (status kept)."

[behaviours.app-bot-account]
label = "assumed"
reason = "What an installation token does is attributed to the App's bot account: login {slug}[bot], type Bot, ID 1000000000 + the App ID (octoemu's own; GitHub's bot IDs are unrelated numbers), html_url the App's page, URLs with the brackets percent-encoded (/users/{slug}%5Bbot%5D). It is the inviter of invitations, the sender of member events the App causes and suspended_by when the App suspends its installation, and GET /users/{slug}[bot] answers it with the same ID. Measured once against GitHub (2026-11-24, scenarios reput-pending-invitation, member-edited-changes, suspended-installation): the shape, the encoding, and one ID across all of them and GET /users. Informational: nothing is refused for it."

# --- Webhooks (GE-04) ---------------------------------------------------------

[routes."GET /app/hook/config"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/webhooks#get-a-webhook-configuration-for-an-app"
# {url, content_type: "json", secret: "********" (null when unsigned), insecure_ssl}.

[routes."PATCH /app/hook/config"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/webhooks#update-a-webhook-configuration-for-an-app"
# url, content_type (json only; form is a 422), secret (replaces every seeded
# secret; "" stops signing), insecure_ssl (0 or 1, stored, not acted on).

[routes."GET /app/hook/deliveries"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/webhooks#list-deliveries-for-an-app-webhook"
# per_page, cursor (next/prev in Link), status=success (200-399) | failure.

[routes."GET /app/hook/deliveries/{delivery_id}"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/webhooks#get-a-delivery-for-an-app-webhook"

[routes."POST /app/hook/deliveries/{delivery_id}/attempts"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/webhooks#redeliver-a-delivery-for-an-app-webhook"
# 202 {}; the redelivery is queued like any delivery.

[behaviours.webhook-delivery-headers]
label = "documented"
doc = "https://docs.github.com/en/webhooks/webhook-events-and-payloads#delivery-headers"
# POST with Content-Type: application/json, User-Agent: GitHub-Hookshot/octoemu,
# X-GitHub-Event, X-GitHub-Delivery (a version-4 GUID), X-GitHub-Hook-ID,
# X-GitHub-Hook-Installation-Target-Type: integration and
# X-GitHub-Hook-Installation-Target-ID: <App ID>. The payload gains
# installation {id, node_id} unless it carries the full installation.

[behaviours.webhook-signature]
label = "documented"
doc = "https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries"
# X-Hub-Signature-256: sha256=<hex HMAC-SHA256 of the body> and the legacy
# X-Hub-Signature: sha1=<hex HMAC-SHA1>, when a secret is set; the page's test
# vector is a unit test (src/webhooks.rs).

[behaviours.webhook-timeout]
label = "documented"
doc = "https://docs.github.com/en/webhooks/using-webhooks/handling-failed-webhook-deliveries"
# "takes longer than 10 seconds to respond, GitHub will record the delivery as
# a failure"; a non-2xx response or a connection failure fails too
# (`Builder::webhook_timeout` shortens the 10 s for tests).

[behaviours.webhook-no-retry]
label = "documented"
doc = "https://docs.github.com/en/webhooks/using-webhooks/handling-failed-webhook-deliveries"
# "GitHub does not automatically redeliver failed webhook deliveries."

[behaviours.webhook-redelivery]
label = "documented"
doc = "https://docs.github.com/en/webhooks/using-webhooks/best-practices-for-using-webhooks#use-the-x-github-delivery-header"
# A redelivery resends the same body with the same X-GitHub-Delivery and
# redelivery: true.

[behaviours.installation-events]
label = "documented"
doc = "https://docs.github.com/en/webhooks/webhook-events-and-payloads#installation"
# installation (created, deleted, suspend, unsuspend, new_permissions_accepted)
# and installation_repositories (added, removed): "All GitHub Apps receive this
# event by default", whatever they subscribe to. Payloads: the full
# installation, repositories, requester: null and sender; installation_
# repositories adds repository_selection, repositories_added and
# repositories_removed ({id, node_id, name, full_name, private}).

[behaviours.installation-events-while-suspended]
label = "assumed"
reason = "installation events reach the App even while the installation is suspended (suspend itself, then unsuspend or deleted); GitHub documents the suspend action but not its delivery to a suspended installation."

[behaviours.suspended-installation-webhooks]
label = "assumed"
reason = "a suspended installation is no target of any other event; GitHub documents only that a suspended App cannot access the account's resources."

[behaviours.installation-repositories-events]
label = "assumed"
reason = "a selection change announces one added event (repositories_removed empty) and one removed event (repositories_added empty) rather than one event with both lists; switching all/selected is diffed the same way."

[behaviours.installation-event-sender]
label = "assumed"
reason = "sender for admin actions without one named: the user account itself, or an organization's first active owner (else the organization); the App's bot for PUT/DELETE /app/installations/{id}/suspended."

[behaviours.webhook-secret-rotation]
label = "assumed"
reason = "rotation model: GitHub keeps one current secret per App, so octoemu signs with the first of webhook.secrets only (at send time, so a redelivery after a change uses the new one); the rest are never used."

[behaviours.webhook-ordering]
label = "assumed"
reason = "each App's deliveries are sent one at a time in event order; GitHub documents no ordering."

[behaviours.webhook-delivery-retention]
label = "assumed"
reason = "attempts are kept for the instance's life and every one can be redelivered; GitHub's docs mention a 3-day window for redelivery, not modelled."

[behaviours.webhook-hook-id]
label = "assumed"
reason = "X-GitHub-Hook-ID is 400000000 plus the App ID; GitHub's App hook IDs are unrelated numbers."

[behaviours.webhook-status-texts]
label = "assumed"
reason = "status texts other than OK (Invalid HTTP Response: <code>, timed out, Couldn't connect to server) are recalled from GitHub's UI; withheld in refuse-assumed mode. Status code 0 without a response, which status=failure matches."

[behaviours.webhook-deliveries-cursor]
label = "assumed"
reason = "the list runs newest first and the cursor is v1_<delivery id>; a bad cursor or status is a 400 with a guessed message. Refused with a cursor in refuse-assumed mode."

[behaviours.webhook-config-details]
label = "assumed"
reason = "GET /app/hook/config for an App without a webhook is a 404, and PATCH errors are 422 Validation Failed on the field."

# --- OAuth web flow and user tokens (GE-05) ------------------------------------

[routes."GET /login/oauth/authorize"]
label = "documented"
doc = "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app#using-the-web-application-flow-to-generate-a-user-access-token"
# client_id, redirect_uri (omitted: the first callback), state,
# code_challenge + code_challenge_method=S256, login, allow_signup (ignored),
# prompt=select_account. The page itself (a list of the seeded users with
# consent forms, auto-consent for login=) is octoemu's.

[routes."POST /login/oauth/authorize"]
label = "assumed"
reason = "octoemu's consent form: the page's buttons post the request's parameters plus login (authorize) or cancel (access_denied) back to the same path. GitHub's own consent form is not an API."

[routes."POST /login/oauth/access_token"]
label = "documented"
doc = "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app#using-the-web-application-flow-to-generate-a-user-access-token"
# A form or JSON body (or query parameters): client_id, client_secret, code,
# redirect_uri, code_verifier; or grant_type=refresh_token with
# refresh_token (https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/refreshing-user-access-tokens).

[routes."GET /user"]
label = "documented"
doc = "https://docs.github.com/en/rest/users/users#get-the-authenticated-user"
# A user token (ghu_ or ghp_), no permission. The public-user fields; email
# per user-public-email.

[routes."GET /user/emails"]
label = "documented"
doc = "https://docs.github.com/en/rest/users/emails#list-email-addresses-for-the-authenticated-user"
# email_addresses: read (a user permission of the App); a PAT needs user or
# user:email (pat-scopes). Paged: per_page default 30, at most 100.

[routes."GET /user/repository_invitations"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/invitations#list-repository-invitations-for-the-authenticated-user"

[routes."PATCH /user/repository_invitations/{invitation_id}"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/invitations#accept-a-repository-invitation"
# 204; member.added. 404 for an invitation that is not the user's; an
# expired one per accept-expired-invitation. 304/403/409 are not modelled.

[routes."DELETE /user/repository_invitations/{invitation_id}"]
label = "documented"
doc = "https://docs.github.com/en/rest/collaborators/invitations#decline-a-repository-invitation"
# 204, no event.

[routes."POST /applications/{client_id}/token"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/oauth-applications#check-a-token"
# Basic client_id:client_secret, JSON {access_token}: 200 with the
# authorization (token, token_last_eight, hashed_token, app, user,
# expires_at, ...); 404 invalid token; 422 without access_token.

[routes."PATCH /applications/{client_id}/token"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/oauth-applications#reset-a-token"
# The old token stops working; 200 with the new one (same shape as check).

[routes."DELETE /applications/{client_id}/token"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/oauth-applications#delete-an-app-token"
# 204; the token and its refresh token stop working.

[routes."DELETE /applications/{client_id}/grant"]
label = "documented"
doc = "https://docs.github.com/en/rest/apps/oauth-applications#delete-an-app-authorization"
# 204; every token the App holds for that user stops working.

[behaviours.redirect-uri-match]
label = "documented"
doc = "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps#redirect-urls"
# redirect_uri must be one of the App's callback URLs (exactly); omitted, the
# first one is used.

[behaviours.redirect-uri-loopback-port]
label = "assumed"
reason = "A loopback redirect_uri (127.0.0.1, ::1, localhost) matches a callback that differs only in port. Documented for OAuth apps; unmeasured for GitHub Apps. A match resting on it is refused in refuse-assumed mode."

[behaviours.oauth-authorize-errors]
label = "documented"
doc = "https://docs.github.com/en/apps/oauth-apps/maintaining-oauth-apps/troubleshooting-authorization-request-errors"
# redirect_uri_mismatch (to the first registered callback), access_denied
# (POST /__octoemu/oauth/deny, a per-user denial, or the page's Cancel) and
# application_suspended (a seeded `suspended` App) redirect to the callback
# with error, error_description, error_uri (the page's texts) and state.

[behaviours.authorize-page-errors]
label = "assumed"
reason = "An unknown client_id (404), an App without callback URLs (400) and malformed PKCE parameters (both or neither, S256 only, 43 base64url characters; 400) are shown as an HTML error page rather than redirected; GitHub's exact answers are unmeasured. Refused in refuse-assumed mode."

[behaviours.pkce]
label = "documented"
doc = "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-user-access-token-for-a-github-app#using-the-web-application-flow-to-generate-a-user-access-token"
# code_challenge: 43 characters, code_challenge_method S256 (plain is not
# supported); the exchange's code_verifier must hash to the challenge.

[behaviours.pkce-exchange-errors]
label = "assumed"
reason = "A wrong or missing code_verifier for a code issued with a challenge, or a verifier for a code issued without one, is bad_verification_code. GitHub's error code for these is unmeasured. Refused in refuse-assumed mode."

[behaviours.oauth-code]
label = "documented"
doc = "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps#2-users-are-redirected-back-to-your-site-by-github"
# Codes expire after 10 minutes (virtual clock), work once, and are bound to
# their App and redirect URI. Any exchange naming a valid code of the App uses
# it up, even one that then fails (assumed detail).

[behaviours.oauth-token-response]
label = "documented"
doc = "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps#response"
# Form-encoded by default; JSON with Accept: application/json (XML is not
# offered). access_token, expires_in 28800, refresh_token,
# refresh_token_expires_in 15897600, scope "", token_type bearer; without
# expiring tokens no expiry or refresh fields.

[behaviours.oauth-token-errors]
label = "documented"
doc = "https://docs.github.com/en/apps/oauth-apps/maintaining-oauth-apps/troubleshooting-oauth-app-access-token-request-errors"
# incorrect_client_credentials, redirect_uri_mismatch, bad_verification_code,
# unverified_user_email (the user's primary address is unverified) with the
# page's error_description and an absolute error_uri on docs.github.com
# (measured 2026-11-24, oauth-exchange-errors).

[behaviours.oauth-error-status]
label = "assumed"
reason = "Token-endpoint errors are answered with HTTP 200 and the error in the body; a client_id naming no App is a 404 with {\"error\": \"Not Found\"}. Measured against GitHub (2026-11-24, scenario oauth-exchange-errors, twice): 200 for a bad code (JSON and form-encoded), a wrong secret, a bad refresh token and an unknown grant type; 404 for an unknown client. Refused in refuse-assumed mode."

[behaviours.bad-refresh-token-text]
label = "assumed"
reason = "bad_refresh_token's error_description 'The refresh token passed is incorrect or expired.' and its error_uri (the bad code's anchor, #bad-verification-code) are not documented. Measured once against GitHub (2026-11-24, scenario oauth-exchange-errors). Withheld in refuse-assumed mode."

[behaviours.unsupported-grant-type]
label = "assumed"
reason = "A grant_type other than refresh_token is read as the code grant: with a bad code it is bad_verification_code, not unsupported_grant_type. Measured against GitHub (2026-11-24, scenario oauth-exchange-errors, twice: grant_type=password with a bad code); what a good code does with an unknown grant type is unmeasured. Refused in refuse-assumed mode for a grant_type other than authorization_code and refresh_token."

[behaviours.refresh-token-rotation]
label = "documented"
doc = "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/refreshing-user-access-tokens"
# A refresh token works once; using it kills it and the old access token and
# returns a new pair. Six months' lifetime.

[behaviours.user-token-expiry]
label = "documented"
doc = "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/refreshing-user-access-tokens"
# ghu_ tokens expire after 8 hours on the virtual clock when the App's
# expire_user_tokens is on (the default); otherwise never.

[behaviours.user-token-revocation]
label = "documented"
doc = "https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/token-expiration-and-revocation"
# A revoked user token (DELETE /applications/{client_id}/token or /grant, a
# refresh, a reset) is 401 Bad credentials on its next use.

[behaviours.user-token-permissions]
label = "documented"
doc = "https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/authenticating-with-a-github-app-on-behalf-of-a-user"
# A ghu_ token holds the App's user (account) permissions and its repository
# permissions; on resource routes it reaches only what the user can access and
# an installation of the App covers. Without the route's permission: 403
# Resource not accessible by integration with X-Accepted-GitHub-Permissions.

[behaviours.user-token-cap]
label = "assumed"
reason = "At most 10 live user access tokens per user and App: minting the 11th revokes the oldest (and its refresh token). Documented for OAuth apps (per user/application/scope); unmeasured for GitHub App ghu_ tokens (plan §4 [M] scenario 6). Refused in refuse-assumed mode when it would apply."

[behaviours.user-token-hourly-limit]
label = "assumed"
reason = "After user_tokens_per_hour (default 10; seed settings or POST /__octoemu/oauth) new tokens for a user and App within an hour, login= no longer auto-consents: the page asks to authorize again and the form's choice issues the code. Documented for OAuth apps as a re-authorization prompt; unmeasured for GitHub Apps. Refused in refuse-assumed mode when it applies."

[behaviours.user-token-invitations]
label = "assumed"
reason = "A GitHub App's user access token may list, accept and decline the user's repository invitations without any App permission. Unmeasured (classic PATs are documented, with repo:invite). Refused in refuse-assumed mode for ghu_ callers."

[behaviours.pat-scopes]
label = "assumed"
reason = "Classic PAT scopes are checked only for GET /user/emails (user or user:email); a PAT without one gets 403 'Resource not accessible by personal access token' with X-Accepted-OAuth-Scopes and X-OAuth-Scopes. Every other route admits any PAT. Refused in refuse-assumed mode when it applies."

[behaviours.client-credential-errors]
label = "assumed"
reason = "Basic credentials that are not a seeded App's client_id:client_secret are 401 Bad credentials on every route; GitHub may answer the /applications routes with 404. Refused in refuse-assumed mode."

[behaviours.applications-errors]
label = "assumed"
reason = "On the /applications routes, a token that is not a live user access token of this App, or a {client_id} other than the credentials', is 404 Not Found (documented for check only); a body without access_token is 422 Validation Failed with a missing_field error (details withheld in refuse-assumed mode). Refused in refuse-assumed mode."

[behaviours.user-public-email]
label = "documented"
doc = "https://docs.github.com/en/rest/users/users#get-a-user"
# email in GET /user and GET /users/{username} is the publicly visible
# address: the primary one when its visibility is public, else null.

[behaviours.noreply-email]
label = "assumed"
reason = "A user seeded with noreply_email also lists {id}+{login}@users.noreply.github.com in GET /user/emails, verified, not primary, without a visibility. Refused in refuse-assumed mode when listed."

# --- Organizations, teams and memberships (GE-06) -----------------------------

[routes."GET /orgs/{org}"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/orgs#get-an-organization"
# Any installation token (no permission is listed for it). plan {name, space,
# private_repos, filled_seats, seats} per org-plan-visibility; the owner-only
# settings per org-admin-fields.

[routes."GET /orgs/{org}/members"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#list-organization-members"
# members: read. Active members only, by ID; role=all|admin|member; paged.
# filter=2fa_disabled is not modelled.

[routes."GET /orgs/{org}/memberships/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#get-organization-membership-for-a-user"
# members: read. {url, state, role, organization_url, organization, user}; an
# open invitation is a pending membership with the invited role; else 404.

[routes."PUT /orgs/{org}/memberships/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#set-organization-membership-for-a-user"
# members: write. role admin|member (default member), else 422. 200 with the
# membership; a non-member is invited and pending (org-membership-pending).

[routes."DELETE /orgs/{org}/memberships/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#remove-organization-membership-for-a-user"
# members: write. 204. A member is removed (organization.member_removed), an
# invitee's invitation cancelled; anyone else per remove-org-non-member.

[routes."GET /orgs/{org}/invitations"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#list-pending-organization-invitations"
# members: read. Open invitations, oldest first, paged; role= filter. login is
# null for an email invitee; team_count, role, inviter, created_at,
# failed_at/failed_reason null.

[routes."POST /orgs/{org}/invitations"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#create-an-organization-invitation"
# members: write. {invitee_id | email, role (admin, direct_member (default),
# billing_manager, reinstate), team_ids}: 201 with the invitation,
# organization.member_invited. 422s per org-error-messages, org-no-seat,
# org-invitation-limit-response, org-spammed.

[routes."DELETE /orgs/{org}/invitations/{invitation_id}"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#cancel-an-organization-invitation"
# members: write. 204; 404 for an unknown, failed or expired invitation.

[routes."GET /orgs/{org}/invitations/{invitation_id}/teams"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#list-organization-invitation-teams"
# members: read. Paged; 404 for an unknown invitation.

[routes."GET /orgs/{org}/failed_invitations"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#list-failed-organization-invitations"
# members: read. Invitations with failed_at (seeded); expired ones per
# expired-org-invitations-failed. Paged.

[routes."GET /orgs/{org}/teams"]
label = "documented"
doc = "https://docs.github.com/en/rest/teams/teams#list-teams"
# members: read. Every team (secret ones too), by ID, paged.

[routes."GET /orgs/{org}/teams/{team_slug}"]
label = "documented"
doc = "https://docs.github.com/en/rest/teams/teams#get-a-team-by-name"
# members: read. team-full with members_count, repos_count, organization.

[routes."GET /orgs/{org}/teams/{team_slug}/memberships/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/teams/members#get-team-membership-for-a-user"
# members: read. {url, role, state}; an organization owner who is not in the
# team is a 404. Pending through an invitation per invited-team-membership-pending.

[routes."PUT /orgs/{org}/teams/{team_slug}/memberships/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/teams/members#add-or-update-team-membership-for-a-user"
# members: write. role member|maintainer (default member), else 422. 200
# {url, role, state}: active for an active member (membership.added), pending
# for a pending one; a non-member per team-put-non-member. The 403 for an
# IdP-synchronized team is not modelled.

[routes."DELETE /orgs/{org}/teams/{team_slug}/memberships/{username}"]
label = "documented"
doc = "https://docs.github.com/en/rest/teams/members#remove-team-membership-for-a-user"
# members: write. 204 (membership.removed for an active membership).

[routes."GET /user/memberships/orgs"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#list-organization-memberships-for-the-authenticated-user"
# User token. Active and pending memberships (open invitations by login),
# by organization ID; state=active|pending; paged. ghu_ callers per
# user-token-org-membership-list.

[routes."GET /user/memberships/orgs/{org}"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#get-an-organization-membership-for-the-authenticated-user"
# User token, members: read (a ghu_ token's App). 200 or 404.

[routes."PATCH /user/memberships/orgs/{org}"]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#update-an-organization-membership-for-the-authenticated-user"
# User token, members: write (a ghu_ token's App). {"state": "active"} (else
# 422) accepts: 202 with the membership, already active (measured 2026-11-24,
# org-membership-accept, twice; the docs say 200); organization.member_added.
# 404 without a pending membership or invitation.

[behaviours.org-membership-pending]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#set-organization-membership-for-a-user"
# PUT membership for a non-member invites them: pending until they accept
# with PATCH /user/memberships/orgs/{org}. The invitation is visible in GET
# /orgs/{org}/invitations and spends the budget (the docs state the same
# limits on this route).

[behaviours.org-invitation-expiry]
label = "documented"
doc = "https://docs.github.com/en/organizations/managing-membership-in-your-organization/inviting-users-to-join-your-organization"
# An organization invitation expires 7 days after created_at on the virtual
# clock: it leaves the pending list and its pending (team) memberships end.

[behaviours.org-invitation-limit]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/members#create-an-organization-invitation"
# At most 50 invitations per organization per 24 hours (sliding, virtual
# clock), or 500 once the organization is older than a month (created_at)
# or on a paid plan (any plan but free). Counts invitations from POST
# invitations, PUT membership and team PUT for non-members.

[behaviours.org-plan-visibility]
label = "documented"
doc = "https://docs.github.com/en/rest/orgs/orgs#get-an-organization"
# "To see information about an organization's GitHub plan, GitHub Apps need
# the Organization plan permission": plan only for a token with
# organization_plan: read of an installation on the organization.

[behaviours.org-member-events]
label = "documented"
doc = "https://docs.github.com/en/webhooks/webhook-events-and-payloads#organization"
# organization.member_invited {invitation (organization-invitation), user
# (null for an email invitee)}, member_added and member_removed {membership
# {url, state, role, organization_url, user}}, each with organization and
# sender (the App's bot, or the user who accepted or left). Targets: the
# organization's non-suspended installations subscribed to organization.
# member_removed carries the removed membership's role with state active
# (unmeasured detail).

[behaviours.team-membership-events]
label = "documented"
doc = "https://docs.github.com/en/webhooks/webhook-events-and-payloads#membership"
# membership.added|removed {scope: "team", member, team, organization,
# sender} when an active team membership starts or ends (a pending one
# emits nothing). Targets: installations on the organization subscribed to
# membership. Removing an organization member drops their team memberships
# without membership.removed (unmeasured).

[behaviours.team-repository-access]
label = "documented"
doc = "https://docs.github.com/en/organizations/organizing-members-into-teams/about-teams"
# A team's role on a repository is a grant for its active members and the
# active members of its child teams (nested teams inherit the parent's
# access): GET …/permission, affiliation=all and PUT collaborator's 204
# reflect it.

[behaviours.org-admin-fields]
label = "assumed"
reason = "GET /orgs/{org} shows two_factor_requirement_enabled, default_repository_permission, members_can_create_repositories and the private repository counts only to a token with organization_administration: read on the organization (the docs say owners see full details; which fields an installation token sees is unmeasured). Withheld in refuse-assumed mode."

[behaviours.org-error-messages]
label = "assumed"
reason = "422 texts for organization writes (an existing member, an open invitation, an unknown invitee, invalid role/team_ids/state, neither or both of invitee_id and email, reinstate without a former membership) are guesses with resource OrganizationInvitation (or Membership, TeamMember). The 422 status is documented; the text is withheld in refuse-assumed mode."

[behaviours.org-invitation-limit-response]
label = "assumed"
reason = "Past the budget, POST invitations (and PUT membership, team PUT for a non-member) answer 422 Validation Failed with errors[{resource: OrganizationInvitation, field: base, code: custom, message: 'Over invitation rate limit'}]. The limit is documented; the response is unmeasured. Refused in refuse-assumed mode."

[behaviours.org-no-seat]
label = "assumed"
reason = "On a paid plan with seats > 0, an invitation that would make a member (direct_member, admin) when filled_seats >= seats answers 422 with a custom error ('You must purchase at least one more seat…'). filled_seats is the plan's pinned value, else memberships plus open member invitations. Refused in refuse-assumed mode."

[behaviours.org-spammed]
label = "assumed"
reason = "While POST /__octoemu/orgs/{org}/spammed is on, POST and DELETE invitations answer 422 {message: 'Validation Failed', errors: [{resource: OrganizationInvitation, code: spammed}]} (the docs list 'spammed' with the 422; the shape and trigger are unmeasured). Refused in refuse-assumed mode."

[behaviours.expired-org-invitations-failed]
label = "assumed"
reason = "An expired organization invitation moves to GET /orgs/{org}/failed_invitations with failed_at = created_at + 7 days and failed_reason 'Invitation expired'. Unmeasured (SP-08/SP-18). Refused in refuse-assumed mode when the failed list would show one."

[behaviours.org-invitation-cancel]
label = "assumed"
reason = "A cancelled invitation (DELETE invitation, or DELETE membership of an invitee) disappears: it is not listed as failed. Unmeasured. Refused in refuse-assumed mode on DELETE invitation."

[behaviours.org-invitation-decline]
label = "assumed"
reason = "An invitee declining (admin act route) removes the invitation without an event and without a failed entry. Unmeasured. Refused in refuse-assumed mode."

[behaviours.org-invitation-roles]
label = "assumed"
reason = "role reinstate resolves to the role of the invitee's last removal recorded by this instance (admin → admin, member → direct_member), else 422; accepting a billing_manager or hiring_manager invitation uses it up without a membership. Refused in refuse-assumed mode when used."

[behaviours.org-reput-pending]
label = "assumed"
reason = "PUT membership for an invitee (or pending member) changes the pending role and returns it as pending, without a new invitation or budget. Unmeasured. Refused in refuse-assumed mode."

[behaviours.team-put-non-member]
label = "assumed"
reason = "Team PUT for someone who is not an organization member creates a visible direct_member organization invitation carrying the team (spending the budget, organization.member_invited), or adds the team to their open invitation; DELETE drops it again. The docs say only that an invitation is sent and the membership is pending. Refused in refuse-assumed mode."

[behaviours.invited-team-membership-pending]
label = "assumed"
reason = "GET team membership for an invitee whose open invitation names the team answers 200 {state: pending} with the invited team role. Unmeasured (the JS org fakes answer 404). Refused in refuse-assumed mode when it applies."

[behaviours.org-accept-team-events]
label = "assumed"
reason = "Accepting an invitation with teams (or a pending membership with pending team memberships) emits membership.added for each team after organization.member_added, sent by the user. Unmeasured. Not emitted in refuse-assumed mode."

[behaviours.remove-org-non-member]
label = "assumed"
reason = "DELETE membership of a user with neither a membership nor an open invitation is a 404. Unmeasured. Refused in refuse-assumed mode."

[behaviours.remove-team-non-member]
label = "assumed"
reason = "DELETE team membership of a user who is not in the team (nor invited to it) is a 404. Unmeasured. Refused in refuse-assumed mode."

[behaviours.org-out-of-scope]
label = "assumed"
reason = "An installation token of another account's installation on an organization's members, invitation and team routes is 403 Resource not accessible by integration with X-Accepted-GitHub-Permissions. Unmeasured. Refused in refuse-assumed mode."

[behaviours.email-invitation-accept]
label = "assumed"
reason = "An email invitation keeps login null; a user with a matching verified address accepts it with PATCH /user/memberships/orgs/{org} (or the admin act route) and gets its role and teams. Whether GitHub resolves the address to an existing account, and how the invitee accepts, is unmeasured. Refused in refuse-assumed mode when used."

[behaviours.user-token-org-membership-list]
label = "assumed"
reason = "A GitHub App's user access token may call GET /user/memberships/orgs without any App permission (the route is not in GitHub's permission table; PATs are documented). Refused in refuse-assumed mode for ghu_ callers."

