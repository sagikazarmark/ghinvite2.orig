[package]
name = "octoemu"
description = "A stateful local emulator of the GitHub surface a GitHub App uses, for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "octoemu"
path = "src/main.rs"

# Native only. On wasm32 the library and the binary are empty, so a
# `--workspace` wasm32 build of the toolkit does not reach tokio's `net`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
octoscrub.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
toml.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
reqwest.workspace = true
tokio.workspace = true
