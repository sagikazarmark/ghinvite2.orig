[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
octoauth = { version = "0.1.0", path = "crates/octoauth" }
octoscrub = { version = "0.1.0", path = "crates/octoscrub" }

async-trait = "0.1"
# octoemu only (native): the emulator's HTTP server.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path", "query"] }
base64 = "0.22"
bytes = "1.10.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
http = "1"
js-sys = "0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
octocrab = { version = "0.54.5", default-features = false }
regex = "1.12.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
reqwest-middleware = { version = "0.4", default-features = false }
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
send_wrapper = { version = "0.6", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
static_assertions = "1.1.0"
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
# octoemu only: parses its `fidelity.toml` manifest.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
url = "2.5.4"
wiremock = "0.6"
zeroize = "1"
