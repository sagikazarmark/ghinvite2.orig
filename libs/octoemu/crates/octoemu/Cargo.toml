[package]
name = "octoemu"
description = "A stateful local emulator of the GitHub surface a GitHub App uses, for tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "octoemu"
path = "src/main.rs"

# Native only. On wasm32 the library and the binary are empty, so a
# `--workspace` wasm32 build of the toolkit does not reach tokio's `net`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum.workspace = true
base64.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
getrandom_02.workspace = true
hmac.workspace = true
# The accept loop (fault rules close and reset connections).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
octoscrub.workspace = true
# Webhook delivery to the App's URL.
reqwest.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
socket2 = "0.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time"] }
toml.workspace = true
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The real clients, run against an embedded emulator (tests/app_auth.rs,
# tests/octologin.rs).
octoauth.workspace = true
octologin.workspace = true
octotoken.workspace = true
reqwest.workspace = true
tokio.workspace = true
