[package]
name = "octoemu-conformance"
description = "octoemu's fidelity suite: scenarios run against the emulator or real GitHub, normalised snapshots and a schema check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Native only and test-oriented: on wasm32 the library is empty.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64.workspace = true
chrono = { workspace = true, features = ["clock"] }
# Validates every emulator response against the pinned subset of GitHub's
# OpenAPI 3.1 description (schemas/). No remote or file resolution.
jsonschema = { version = "0.61.2", default-features = false }
octoemu.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["json"] }
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["time"] }
toml.workspace = true
url.workspace = true
