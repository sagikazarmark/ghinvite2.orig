[package]
name = "kekring"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false
description = "Provisioned local KEK for anykms envelopes (stopgap; see README)"

[features]
default = []
global = []
std-loaders = []
# wasm32-unknown-unknown on a JS host (Cloudflare Workers): JS clocks in
# anykms-core and `crypto.getRandomValues()` for nonces.
js = ["anykms-core/js", "anykms-recipes/js", "getrandom/wasm_js"]

[dependencies]
anykms-core = { version = "0.2", default-features = false }
anykms-recipes = { version = "0.2", default-features = false, features = ["envelope"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
hkdf = "0.13"
sha2 = { version = "0.11", features = ["zeroize"] }
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
subtle = "2.6"
getrandom = { version = "0.4", features = ["sys_rng"] }
base64 = "0.23"

[dev-dependencies]
proptest = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
