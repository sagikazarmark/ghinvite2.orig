# Cloudflare Worker — Restate Service
# Release: wrangler versions upload --config wrangler/restate-svc.toml
# Register the immutable version Preview URL; see docs/deploy.md for bootstrap.
# Build: run [build].command from the repository root with worker-build 0.8.1.

name = "ghinvite-restate-svc"
preview_urls = true
main = "../crates/ghinvite-workflows-worker/build/worker/shim.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build crates/ghinvite-workflows-worker --release -- --locked"

[[d1_databases]]
binding = "DB"
database_name = "ghinvite"
database_id = "REPLACE_WITH_SAME_ID_AS_WEB_TOML"
# Migrations are managed via wrangler/web.toml — do not apply here.

[vars]
# Explicit registry stage; org delivery/target release gates remain separate.
P1_APP_STAGE = "repo"
# Matched web/workflow capability. Keep off until AccessGrant acceptance gates pass.
GH_ACCESS_REMOVAL_ENABLED = "false"
P1_HOST = "p1.example.com"
GH_REPO_APP_ID = "REPLACE_WITH_REPO_APP_NUMERIC_ID"
GH_REPO_CLIENT_ID = "REPLACE_WITH_REPO_APP_CLIENT_ID"
RESTATE_IDENTITY_KEYS = "REPLACE_WITH_RESTATE_PUBLICKEYV1_KEYS"

# Secrets (set via `wrangler secret put`):
# GH_REPO_PRIVATE_KEYS - kid:base64(PKCS#8 PEM);kid:...; first entry signs.
#   Convert a downloaded PKCS#1 key with openssl pkcs8 -topk8 -nocrypt first.
#   Provision the exact list through the Wrangler secret prompt; never put it in vars.
# RESTATE_IDENTITY_KEYS is a required comma/whitespace-separated public-key list.
# Add the new key alongside the old one before Restate switches signers; remove
# the old key after pinned invocations no longer require it. Missing/invalid keys
# fail startup. The production Worker has no unsigned-development bypass.
# M0 explicitly selects the repo app only. No sign-in/webhook/session secrets here.
