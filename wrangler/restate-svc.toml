# Cloudflare Worker — Restate Service
# Deploy: wrangler deploy --config wrangler/restate-svc.toml
# Build: worker-build --release -p ghinvite-workflows-worker

name = "ghinvite-restate-svc"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build --release -p ghinvite-workflows-worker"

[[d1_databases]]
binding = "DB"
database_name = "ghinvite"
database_id = "REPLACE_WITH_SAME_ID_AS_WEB_TOML"
# Migrations are managed via wrangler/web.toml — do not apply here.

[vars]
GHINVITE_GITHUB_APP_ID = "REPLACE_WITH_GITHUB_APP_NUMERIC_ID"

# Secrets (set via `wrangler secret put`):
# GHINVITE_GITHUB_APP_PRIVATE_KEY - base64-encoded GitHub App private key PEM:
#   Linux:  base64 -w0 private-key.pem | wrangler secret put GHINVITE_GITHUB_APP_PRIVATE_KEY --config wrangler/restate-svc.toml
#   macOS:  base64 private-key.pem | tr -d '\n' | wrangler secret put GHINVITE_GITHUB_APP_PRIVATE_KEY --config wrangler/restate-svc.toml
# RESTATE_IDENTITY_KEY            - from Restate Cloud console (Deployments → Identity key)
