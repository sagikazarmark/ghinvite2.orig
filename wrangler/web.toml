# Cloudflare Worker — Web binary
# Deploy: wrangler deploy --config wrangler/web.toml
# Build: run [build].command from this directory with worker-build 0.8.1.

name = "ghinvite-web"
main = "../crates/ghinvite-web-worker/build/worker/shim.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build ../crates/ghinvite-web-worker --release -- --locked"

# Static assets: the Dioxus island bundle (ADR 0001), served by Cloudflare
# before the Worker is invoked. `scripts/build-island.sh` writes the bundle to
# `dist/public/assets/` (path relative to this config file, like
# `migrations_dir` below); it must exist when `wrangler deploy` runs.
#
# Routing: any request whose path matches a file under `directory` is answered
# by Static Assets; everything else falls through to the Worker (axum), so the
# SSR 404 page still works. Because of that the directory must contain ONLY
# `assets/*` — never an `index.html` or other HTML, which would shadow `/`.
# `not_found_handling` is deliberately unset (the "single-page-application"
# mode would serve index.html for every unmatched navigation and hijack `/`,
# `/i/{code}`, `/login`). `run_worker_first` is unnecessary: no SSR route lives
# under `/assets/`, so asset-first routing cannot intercept a Worker route.
#
# Cache headers: Static Assets default to `Cache-Control: public, max-age=0,
# must-revalidate` + ETag. The dx output is content-hashed, so the build script
# also writes `dist/public/_headers` marking `/assets/*-dxh*` as
# `public, max-age=31536000, immutable`; the stable loader
# `/assets/ghinvite-island.js` keeps the revalidating default.
[assets]
directory = "../dist/public"

# D1 database binding (matches env.d1("DB") in ghinvite-web-worker/src/lib.rs)
[[d1_databases]]
binding = "DB"
database_name = "ghinvite"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"
migrations_dir = "../migrations"

# KV namespace for session storage (matches env.kv("SESSIONS"))
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_WRANGLER_KV_CREATE_OUTPUT"

# Non-secret config vars
[vars]
GHINVITE_ADMISSION_MODE = "legacy" # maintenance / authoritative after cutover gates
GHINVITE_BASE_URL           = "https://ghinvite.workers.dev"
GHINVITE_RESTATE_INGRESS    = "https://ACCOUNT_ID.restate.cloud"
GHINVITE_RESTATE_AUTH       = "bearer" # production requires protected ingress
GHINVITE_GITHUB_INSTALL_URL = "https://github.com/apps/YOUR_APP_NAME/installations/new"

# Secrets (set via `wrangler secret put`; never commit these values):
# GHINVITE_SESSION_SECRET       - generate: openssl rand -hex 32
# GHINVITE_RESTATE_API_KEY      - Restate Cloud ingress API key (web -> Restate)
# GHINVITE_GITHUB_CLIENT_ID     - from GitHub App settings
# GHINVITE_GITHUB_CLIENT_SECRET - from GitHub App settings
# GHINVITE_WEBHOOK_SECRET       - from GitHub App settings
