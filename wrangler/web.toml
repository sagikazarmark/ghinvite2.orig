# Cloudflare Worker — Web binary
# Deploy: wrangler deploy --config wrangler/web.toml
# Build: run [build].command from the repository root with worker-build 0.8.1.

name = "ghinvite-web"
main = "../crates/ghinvite-web-worker/build/worker/shim.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
# First successful run records the UTC daily summary; hourly retries recover outages.
crons = ["5 * * * *"]

[build]
command = "worker-build crates/ghinvite-web-worker --release -- --locked"

# Static assets: the Dioxus island bundle (ADR 0001), served by Cloudflare
# before the Worker is invoked. `scripts/build-island.sh` writes the bundle to
# `dist/public/assets/` (path relative to this config file, like
# `migrations_dir` below); it must exist when `wrangler deploy` runs.
#
# Routing: any request whose path matches a file under `directory` is answered
# by Static Assets; everything else falls through to the Worker (axum), so the
# SSR 404 page still works. Because of that the directory must contain ONLY
# `assets/*` — never an `index.html` or other HTML, which would shadow `/`.
# `not_found_handling` is deliberately unset (the "single-page-application"
# mode would serve index.html for every unmatched navigation and hijack `/`,
# `/i/{code}`, `/login`). `run_worker_first` is unnecessary: no SSR route lives
# under `/assets/`, so asset-first routing cannot intercept a Worker route.
#
# Cache headers: Static Assets default to `Cache-Control: public, max-age=0,
# must-revalidate` + ETag. The dx output is content-hashed, so the build script
# also writes `dist/public/_headers` marking `/assets/*-dxh*` as
# `public, max-age=31536000, immutable`; the stable loader
# `/assets/ghinvite-island.js` keeps the revalidating default.
[assets]
directory = "../dist/public"

# D1 database binding (matches env.d1("DB") in ghinvite-web-worker/src/lib.rs)
[[d1_databases]]
binding = "DB"
database_name = "ghinvite"
database_id = "REPLACE_WITH_WRANGLER_D1_CREATE_OUTPUT"
migrations_dir = "../migrations"

# KV namespace for session storage (matches env.kv("SESSIONS"))
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_WRANGLER_KV_CREATE_OUTPUT"

[[kv_namespaces]]
binding = "AUTHZ_CACHE"
id = "REPLACE_WITH_WRANGLER_AUTHZ_KV_CREATE_OUTPUT"

# Non-secret config vars
[vars]
# Explicit registry stage; org delivery/target release gates remain separate.
P1_APP_STAGE = "repo"
# Never set GITHUB_API_BASE/GITHUB_WEB_BASE/GITHUB_AVATAR_BASE here: deployed
# builds refuse them (runtime-tests harness builds only; docs/deploy.md).
# Matched web/workflow capability. Keep off until AccessGrant acceptance gates pass.
GH_ACCESS_REMOVAL_ENABLED = "false"
P1_HOST                    = "ghinvite.workers.dev"
RESTATE_INGRESS_URL    = "https://ACCOUNT_ID.restate.cloud"
GHINVITE_GITHUB_INSTALL_URL = "https://github.com/apps/YOUR_APP_NAME/installations/new"

# Secrets (set via `wrangler secret put`; never commit these values):
# P1_KEYRING                    - generate descriptor: akr new p1
# P1_OPERATOR_IDS (var)         - comma-separated numeric operator IDs; empty denies all
# RESTATE_INGRESS_TOKEN      - Restate Cloud ingress API key (web -> Restate)
# GH_SIGNIN_CLIENT_ID           - sign-in App client ID (var)
# GH_SIGNIN_CLIENT_SECRET       - sign-in App client secret
# GH_REPO_APP_ID               - numeric repository App ID (var)
# GH_REPO_CLIENT_ID            - repository App client ID (var)
# GH_REPO_PRIVATE_KEYS         - kid:base64(PKCS#8 PEM), primary first; semicolon separated
# GH_REPO_WEBHOOK_SECRETS      - current;previous webhook secrets (repo route only)
# Sign-in is token-free (PKCE, callback {P1_HOST}/oauth/callback); it is the
# only sign-in path and its two names are required.
# Setup and webhooks require the explicit repository registry; no legacy fallback.

# Approximate per-location platform buckets; missing bindings fail startup closed.
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_USER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "AUTHZ_RL"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
