services:
  restate:
    hostname: restate
    image: &restate-image docker.restate.dev/restatedev/restate:1.7.9@sha256:329e32e12059610b681e165161bcd0722d193325b6c893bc46bfec72cd54b595
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:9070:9070
      - 127.0.0.1:9071:9071
      - 127.0.0.1:8080:8080
    environment:
      RESTATE_INGRESS__ADVERTISED_ADDRESS: "http://127.0.0.1:8080"
      RESTATE_ADMIN__ADVERTISED_ADDRESS: "http://127.0.0.1:9070"
    volumes:
      - restate-data:/restate-data

  # Fresh runtime per smoke run; random loopback ports avoid the dev stack.
  restate-smoke:
    profiles: [smoke]
    image: *restate-image
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1::9070
      - 127.0.0.1::8080

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://host.docker.internal:8787

volumes:
  restate-data:
