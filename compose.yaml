services:
  restate:
    hostname: restate
    image: &restate-image docker.restate.dev/restatedev/restate:1.8.1@sha256:fea6b4a893616fd8ec4594bd72fbf9967f9ab9242c8c75008de75edfbb58b2c7
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:9070:9070
      - 127.0.0.1:9071:9071
      - 127.0.0.1:8080:8080
    environment:
      RESTATE_INGRESS__ADVERTISED_ADDRESS: "http://127.0.0.1:8080"
      RESTATE_ADMIN__ADVERTISED_ADDRESS: "http://127.0.0.1:9070"
    volumes:
      - restate-data:/restate-data

  # Fresh runtime per smoke run; random loopback ports avoid the dev stack.
  restate-smoke:
    profiles: [smoke]
    image: *restate-image
    environment:
      # scripts/test-restate.sh overrides this to exercise actual workflow cleanup.
      RESTATE_WORKER__CLEANUP_INTERVAL: "${RESTATE_PROOF_CLEANUP_INTERVAL:-1h}"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1::9070
      - 127.0.0.1::8080

  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://host.docker.internal:8787

volumes:
  restate-data:
