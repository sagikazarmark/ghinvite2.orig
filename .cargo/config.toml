# Workspace-wide cargo config.
#
# `wasm32-unknown-unknown` requires `getrandom`'s `wasm_js` backend (used
# transitively via `rand_core 0.9` -> `getrandom 0.3`). The 0.3 release
# guards the JS backend behind a `--cfg getrandom_backend="wasm_js"` rustc
# flag in addition to the Cargo `wasm_js` feature, so we set both: the
# feature is enabled in `crates/ghinvite-github/Cargo.toml`, the cfg lives here.
#
# Native targets are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
