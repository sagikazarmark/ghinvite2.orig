[workspace]
resolver = "2"
members = [
    "crates/ghinvite-e2e",
    "crates/ghinvite-email-vault",
    "crates/ghinvite-core",
    "crates/ghinvite-config",
    "crates/ghinvite-github",
    "crates/ghinvite-storage-sqlx",
    "crates/ghinvite-storage-d1",
    "crates/ghinvite-workflows",
    "crates/ghinvite-workflows-server",
    "crates/ghinvite-workflows-worker",
    "crates/ghinvite-ui",
    "crates/ghinvite-island",
    "crates/ghinvite-web",
    "crates/ghinvite-web-server",
    "crates/ghinvite-web-worker",
    "libs/kekring",
]
# `libs/octoauth` is its own workspace (the GitHub App toolkit); consumed by path.
# kekring's fuzz targets and anykms conformance run are workspaces of their own too
# (see libs/kekring/README.md).
exclude = ["libs/octoauth", "libs/kekring/fuzz", "libs/kekring/conformance"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anykms-core = { version = "0.4", default-features = false }
# anykms-recipes (0.4, `default-features = false, features = ["envelope"]`, `js` on wasm32) is
# kekring's dependency only: the application reaches the envelope through kekring.
# Provisioned versioned KEK + canonical AAD (see libs/kekring/README.md).
kekring = { path = "libs/kekring", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tracing", "matched-path", "query"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
# The `dioform` facade (Dioxus bindings) is for the browser island only; the
# server and the shared form model use `dioform-core` + `dioform-derive`
# (Dioxus-free validators).
dioform = { version = "0.7.0" }
dioform-core = { version = "0.7.0", default-features = false }
dioform-derive = { version = "0.7.0" }
dioxus = { version = "0.7.10", default-features = false, features = ["html", "macro", "signals", "hooks"] }
dioxus-ssr = { version = "0.7.10" }
hmac = "0.12"
octoevents = { version = "0.5", default-features = false }
parking_lot = "0.12"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "charset"] }
# No `rust_crypto`/`aws_lc_rs`: request identity verification runs on
# ghinvite-workflows' EdDSA-only jsonwebtoken provider (`src/request_jwt.rs`),
# so jsonwebtoken 10 builds no RSA or NIST-curve code.
restate-sdk = { version = "0.13", default-features = false, features = ["hyper", "schemars"] }
# restate-sdk's request-identity JWT library; the major must match the SDK's.
jsonwebtoken = { version = "10", default-features = false }
ed25519-dalek = "2"
rsa = { version = "0.10", default-features = false, features = ["encoding", "pkcs1v15"] }
schemars = { version = "1.2", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = { version = "1", default-features = false, features = ["axum"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
subtle = "2"
thiserror = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "set-header"] }
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
ulid = { version = "1", features = ["serde"] }
url = "2"
idna = "1.1"
octologin = { path = "libs/octoauth/crates/octologin" }
octoscrub = { path = "libs/octoauth/crates/octoscrub" }
wiremock = "0.6"

# crates depend on each other only via path:
ghinvite-core = { path = "crates/ghinvite-core" }
ghinvite-email-vault = { path = "crates/ghinvite-email-vault" }
ghinvite-config = { path = "crates/ghinvite-config" }
ghinvite-github = { path = "crates/ghinvite-github" }
octoauth = { path = "libs/octoauth/crates/octoauth" }
octotoken = { path = "libs/octoauth/crates/octotoken" }
# Test-only, native-only GitHub emulator: dev-dependency of ghinvite-github.
octoemu = { path = "libs/octoauth/crates/octoemu" }
ghinvite-storage-sqlx = { path = "crates/ghinvite-storage-sqlx" }
ghinvite-storage-d1 = { path = "crates/ghinvite-storage-d1" }
ghinvite-workflows = { path = "crates/ghinvite-workflows" }
ghinvite-ui = { path = "crates/ghinvite-ui" }
ghinvite-web = { path = "crates/ghinvite-web" }
ghinvite-web-server = { path = "crates/ghinvite-web-server" }

# Browser island bundle (`scripts/build-island.sh` → `dx bundle --profile
# island`). A dedicated profile, not `[profile.release]`, so the Workers build
# (`worker-build --release`) and native release builds keep cargo's defaults.
# dx's own `wasm-release` profile only sets `opt-level = "s"` on top of
# `release`; with these settings the shipped wasm is ~30% smaller.
[profile.island]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Not `true`: since LLVM 23 (Rust 1.100) wasm-ld's `--strip-all` also drops
# custom sections, including wasm-bindgen's metadata, and dx strips before it
# runs wasm-bindgen ("import ... doesn't have an adapter listed";
# wasm-bindgen/wasm-bindgen#5268). wasm-opt still strips the shipped names.
strip = "debuginfo"

# Wasm clocks and input draining: merged upstream as restatedev/sdk-rust#141
# (2026-11-10) but not yet in a release. Pinned to that commit, which is 0.13.0
# plus the fix and nothing else (later main carries a breaking TerminalErrorExt
# change, #132). Drop this patch when 0.13.1+ ships with it.
[patch.crates-io]
restate-sdk = { git = "https://github.com/restatedev/sdk-rust", rev = "8a39311" }
