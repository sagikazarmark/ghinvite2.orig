[workspace]
resolver = "2"
members = [
    "crates/ghinvite-core",
    "crates/ghinvite-storage-sqlx",
    "crates/ghinvite-storage-d1",
    "crates/ghinvite-github",
    "crates/ghinvite-workflows",
    "crates/ghinvite-workflows-worker",
    "crates/ghinvite-ui",
    "crates/ghinvite-island",
    "crates/ghinvite-web",
    "crates/ghinvite-web-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tracing", "matched-path", "query"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
cookie = { version = "0.18", default-features = false }
# The `dioform` facade (Dioxus bindings) is for the browser island only; the
# server and the shared form model use `dioform-core` + `dioform-derive`
# (Dioxus-free validators).
dioform = { version = "0.7.0" }
dioform-core = { version = "0.7.0", default-features = false }
dioform-derive = { version = "0.7.0" }
dioxus = { version = "0.7.10", default-features = false, features = ["html", "macro", "signals", "hooks"] }
dioxus-ssr = { version = "0.7.10" }
hmac = "0.12"
jsonwebtoken = { version = "10", default-features = false }   # only used by tests as a verifier
oauth2 = { version = "5", default-features = false, features = ["reqwest"] }
octoevents = { version = "0.2", default-features = false, features = ["http-body", "derive", "tracing"] }
parking_lot = "0.12"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "charset"] }
restate-sdk = { version = "0.12", default-features = false, features = ["hyper", "schemars", "rust_crypto"] }
rsa = { version = "0.9", default-features = false, features = ["pem", "sha2"] }
schemars = { version = "1.2", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = { version = "1", default-features = false, features = ["axum"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
subtle = "2"
thiserror = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace", "set-header"] }
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { version = "0.15", default-features = false, features = ["sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
ulid = { version = "1", features = ["serde"] }
url = "2"
wiremock = "0.6"

# crates depend on each other only via path:
ghinvite-core = { path = "crates/ghinvite-core" }
ghinvite-storage-sqlx = { path = "crates/ghinvite-storage-sqlx" }
ghinvite-storage-d1 = { path = "crates/ghinvite-storage-d1" }
ghinvite-github = { path = "crates/ghinvite-github" }
ghinvite-workflows = { path = "crates/ghinvite-workflows" }
ghinvite-ui = { path = "crates/ghinvite-ui" }
ghinvite-web = { path = "crates/ghinvite-web" }

# Browser island bundle (`scripts/build-island.sh` → `dx bundle --profile
# island`). A dedicated profile, not `[profile.release]`, so the Workers build
# (`worker-build --release`) and native release builds keep cargo's defaults.
# dx's own `wasm-release` profile only sets `opt-level = "s"` on top of
# `release`; with these settings the shipped wasm is ~30% smaller.
[profile.island]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Wasm clocks and input draining: https://github.com/restatedev/sdk-rust/pull/128
[patch.crates-io]
restate-sdk = { git = "https://github.com/sagikazarmark/restate-sdk-rust", rev = "e882e9e04f9ad9942b4fe7f3788999a521dfa336" }
