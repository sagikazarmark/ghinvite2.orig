name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  css:
    name: CSS freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/ghinvite-web/package-lock.json
      - name: Build production CSS
        working-directory: crates/ghinvite-web
        run: npm ci && npm run build:css
      - name: Check tracked CSS is up to date
        run: git diff --exit-code -- crates/ghinvite-web/assets/styles.built.css

  wasm32:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Each crate is built with `-p` on purpose: `cfg(target_arch = "wasm32")`
      # means "Cloudflare Workers" in the Worker crates and "browser" in
      # ghinvite-ui / ghinvite-island, and a `--workspace --target
      # wasm32-unknown-unknown` build would unify features across both (ADR 0001).
      - run: cargo check -p ghinvite-ui --target wasm32-unknown-unknown
      - run: cargo check -p ghinvite-island --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-storage-d1 --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-web-worker --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-workflows-worker --target wasm32-unknown-unknown

  worker-runtime:
    name: Worker session and admission runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: tests/worker/package-lock.json
      - uses: cargo-bins/cargo-binstall@main
      # Must match Cargo.lock; tests/worker/build.mjs checks before building.
      - run: cargo binstall -y wasm-bindgen-cli@0.2.120
      - run: npm ci --prefix tests/worker
      - run: npm test --prefix tests/worker
      - run: npm run test:queue --prefix tests/worker
      - run: npm run test:deadlines --prefix tests/worker
      - run: npm run test:admission --prefix tests/worker

  island:
    name: Island bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Dioxus CLI as a prebuilt binary: `cargo install dioxus-cli` compiles
      # the CLI from source (~10 min per run, and rust-cache does not cache
      # installed binaries), whereas binstall downloads the release asset in
      # seconds. Pinned to the version the bundle was verified with.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y dioxus-cli@0.7.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            crates/ghinvite-web/package-lock.json
            tests/browser/package-lock.json
      # dx bundle → dist/public (hashed js/wasm, stable loader, _headers);
      # fails if the gzipped bundle exceeds the 600 KB budget.
      - run: scripts/build-island.sh
      # Markup parity: the island's first frame must equal the server's HTML.
      - run: cargo test -p ghinvite-island
      - run: cargo clippy -p ghinvite-island --target wasm32-unknown-unknown -- -D warnings
      - name: Build production CSS
        working-directory: crates/ghinvite-web
        run: npm ci && npm run build:css
      - name: Install browser tests
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser regressions
        working-directory: tests/browser
        run: npm test
      - name: Authoritative admission browser regressions
        working-directory: tests/browser
        run: npx playwright test --config admission.config.mjs
      - name: Document shell browser regressions
        working-directory: tests/browser
        run: npx playwright test --config document.config.mjs
      - name: Requester delivery browser regressions
        working-directory: tests/browser
        run: npx playwright test --config delivery.config.mjs
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: island-bundle
          path: dist/public
          if-no-files-found: error

  integration:
    name: Restate approval and delivery gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # The runner owns the disposable runtime; the test owns loopback GitHub
      # stub/endpoint tasks. Failure diagnostics stay in retained Actions logs.
      - name: Verify approval, fanout, retry, and duplicate operations
        run: bash scripts/test-restate.sh
      - name: Verify isolated authoritative admission and recovery
        run: bash scripts/test-restate.sh authoritative_admission
      - name: Verify retained delivery and uncertain HTTP recovery
        run: bash scripts/test-restate.sh retained_delivery
      - name: Rehearse authoritative writer cutover
        run: bash scripts/test-restate.sh writer_cutover
      - name: Verify installation convergence and admission availability
        run: bash scripts/test-restate.sh installation_availability
