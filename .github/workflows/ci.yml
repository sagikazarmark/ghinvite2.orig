name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify bounded operational collector and privacy contracts
        run: python3 -m unittest discover -s deploy/observability -p 'test_*.py'
      - name: Validate operational alert syntax and behavior
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/observability:/config:ro" --workdir /config prom/prometheus@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62 test rules alerts-test.yml
      - name: Run tests
        run: cargo test --workspace

  native-fallback:
    name: Native fallback release artifacts
    runs-on: ubuntu-24.04
    needs: island
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: island-bundle
          path: dist/public
      - name: Validate native packaging inputs
        run: python3 scripts/test-native-fallback.py
      - name: Build both production native entrypoints and bind package to checkout
        env:
          CHECKOUT_SHA: ${{ github.sha }}
        run: python3 scripts/package-native-fallback.py --sha "$CHECKOUT_SHA" --output dist/native-fallback
      - uses: actions/upload-artifact@v4
        with:
          name: native-fallback-linux-x86_64-${{ github.sha }}
          path: dist/native-fallback
          if-no-files-found: error
          retention-days: 30

  toolkit:
    name: GitHub App toolkit (libs/octoauth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/octoauth
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/octoauth
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check --locked -p octoauth -p octotoken -p octologin -p octoscrub --target wasm32-unknown-unknown

  native-d1-bridge:
    name: Native workflow same-authority D1 bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      EVIDENCE_ROOT: dist/native-d1-bridge-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: tests/worker/package-lock.json
      - run: npm ci --prefix tests/worker
      - run: node --test tests/native-d1-bridge/runtime-output.test.mjs
      - name: Actual shared D1 contracts, ACK loss, rollback and production startup refusals
        run: bash scripts/verify-native-d1-bridge.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-d1-bridge-evidence
          path: dist/native-d1-bridge-evidence
          if-no-files-found: error
          retention-days: 14

  native-d1-cutover:
    name: Pinned Worker to native D1 cutover (owned local)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      EVIDENCE_ROOT: dist/native-d1-cutover-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: tests/worker/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.120
      - run: npm ci --prefix tests/worker
      - name: Extract and verify pinned Restate 1.8.1 (no service deployment)
        run: |
          fixture_container=$(docker create docker.restate.dev/restatedev/restate:1.8.1@sha256:fea6b4a893616fd8ec4594bd72fbf9967f9ab9242c8c75008de75edfbb58b2c7)
          trap 'docker rm -f "$fixture_container" >/dev/null 2>&1 || true' EXIT
          docker cp "$fixture_container:/usr/local/bin/restate-server" "$RUNNER_TEMP/restate-server"
          chmod +x "$RUNNER_TEMP/restate-server"
          printf '%s  %s\n' cb4c0890a347d3193d9ab5e04e37c83d555ebdb2d42ff24e5f447e4dcaeaeb0c "$RUNNER_TEMP/restate-server" | sha256sum --check
          echo "RESTATE_SERVER_BIN=$RUNNER_TEMP/restate-server" >> "$GITHUB_ENV"
      - name: Fresh Worker and exact native examples, pending old invocation and new native provider write
        run: bash scripts/verify-native-d1-cutover.sh
      - name: Retain bounded diagnostics and verified raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-d1-cutover-evidence
          # No runtime databases, binary copies, environment or private credentials.
          path: |
            dist/native-d1-cutover-evidence/*.log
            dist/native-d1-cutover-evidence/*.json
            dist/native-d1-cutover-evidence/*.jsonl
            dist/native-d1-cutover-evidence/*.txt
          if-no-files-found: error
          retention-days: 14
      - name: Retain raw rows and complete streams after successful privacy verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-d1-cutover-verified-runtime
          path: |
            dist/native-d1-cutover-evidence/runtime/*.json
            dist/native-d1-cutover-evidence/runtime/*.log
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      # The Restate integration suites and their fault injection compile only
      # with the `integration` feature, so lint them explicitly.
      - run: cargo clippy -p ghinvite-workflows --features integration --tests -- -D warnings

  css:
    name: CSS freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/ghinvite-web/package-lock.json
      - name: Build production CSS
        working-directory: crates/ghinvite-web
        run: npm ci && npm run build:css
      - name: Check tracked CSS is up to date
        run: git diff --exit-code -- crates/ghinvite-web/assets/styles.built.css

  wasm32:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Each crate is built with `-p` on purpose: `cfg(target_arch = "wasm32")`
      # means "Cloudflare Workers" in the Worker crates and "browser" in
      # ghinvite-ui / ghinvite-island, and a `--workspace --target
      # wasm32-unknown-unknown` build would unify features across both (ADR 0001).
      - run: cargo check -p ghinvite-ui --target wasm32-unknown-unknown
      - run: cargo check -p ghinvite-island --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-storage-d1 --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-web-worker --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-workflows-worker --target wasm32-unknown-unknown
      # The provisioned KEK needs its `js` feature on a JS host (clocks, getrandom).
      - run: cargo check -p anykms-keyring --features js --target wasm32-unknown-unknown

  worker-runtime:
    name: Worker session and admission runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: tests/worker/package-lock.json
      - uses: cargo-bins/cargo-binstall@main
      # Must match Cargo.lock; tests/worker/build.mjs checks before building.
      - run: cargo binstall -y wasm-bindgen-cli@0.2.120
      - run: npm ci --prefix tests/worker
      - run: npm run test:runtime-output --prefix tests/worker
      - run: npm test --prefix tests/worker
      - run: npm run test:queue --prefix tests/worker
      - run: npm run test:history --prefix tests/worker
      - run: npm run test:deadlines --prefix tests/worker
      - name: Bounded operational events on actual Worker
        run: node tests/worker/run-runtime.mjs operational-signals.mjs
      - name: Verified continuation CAS rotation and zero-old zero-bad gate on actual D1
        run: node tests/worker/run-runtime.mjs continuation-rotation.mjs
      - name: Admission timing and privacy on actual Worker
        run: node tests/worker/run-runtime.mjs admission-telemetry.mjs

      - name: Encrypted pending sign-in on actual Worker and D1
        run: node tests/worker/run-runtime.mjs pending-signin.mjs
      - name: Encrypted email recovery and write fence on actual Worker and D1
        run: node tests/worker/run-runtime.mjs email-vault.mjs
      - name: Cross-admin encrypted email review and hourly cleanup on actual D1
        run: node tests/worker/run-runtime.mjs email-review.mjs
      - name: Scheduled protected email cleanup on actual Worker and D1
        run: node tests/worker/run-runtime.mjs email-maintenance.mjs
      - name: Typed domain sign-in on actual Worker and D1
        run: node tests/worker/run-runtime.mjs domain-signin.mjs
      - name: Typed session cutover and pending keyring rollout
        run: node tests/worker/run-runtime.mjs signin-cutover.mjs
      - name: Shared storage conformance on actual D1
        run: npm run test:storage --prefix tests/worker
      - name: Scheduled daily delivery digest on actual Worker and D1
        run: node tests/worker/run-runtime.mjs daily-digest.mjs
      - name: Verify Worker/D1 installation failure and replacement recovery
        run: npm run test:installation --prefix tests/worker
      - name: Org observation and authority on actual signed Workers
        run: ORG_OBSERVATION_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Organization admission and delivery on actual signed Workers
        run: ORG_DELIVERY_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Organization cancellation and expiry on actual signed Workers
        run: ORG_CANCELLATION_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Bulk email delivery and privacy on actual signed Workers and D1
        run: EMAIL_DELIVERY_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Accepted access removal and delayed expiry on signed Workers
        run: ACCESS_REMOVAL_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Administrator reissue on actual signed Workers and D1
        run: REISSUE_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Authenticated organization webhooks on actual Workers and D1
        run: ORG_WEBHOOK_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Retained pause and resume on actual signed Workers
        run: PAUSE_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Delivery control inbox and S0 on actual signed Workers
        run: DELIVERY_CONTROL_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Build isolated cancellation composition
        run: node tests/worker/build.mjs cancellation-fixture
      - name: Separately fenced cancellation on actual signed Workers
        run: CANCELLATION_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - name: Authenticated organization cap on actual signed Workers
        run: BUDGET_CAP_ONLY=1 node tests/worker/run-runtime.mjs admission.mjs
      - run: npm run test:admission --prefix tests/worker
      - name: Authenticated assembled journey on actual Workers and D1
        run: npm run test:journey --prefix tests/worker
      - name: Verify approved delivery without projected parents on Worker/D1
        run: npm run test:delivery --prefix tests/worker

  worker-production:
    name: Production-feature Worker packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: tests/worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y wasm-bindgen-cli@0.2.120 worker-build@0.8.1
      - run: npm ci --prefix tests/worker
      - run: npm run test:runtime-output --prefix tests/worker
      - name: Build deployment artifacts and verify runtime entrypoints without fixture routes
        run: npm run test:production --prefix tests/worker

  island:
    name: Island bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Dioxus CLI as a prebuilt binary: `cargo install dioxus-cli` compiles
      # the CLI from source (~10 min per run, and rust-cache does not cache
      # installed binaries), whereas binstall downloads the release asset in
      # seconds. Pinned to the version the bundle was verified with.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y dioxus-cli@0.7.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            crates/ghinvite-web/package-lock.json
            tests/browser/package-lock.json
      # dx bundle → dist/public (hashed js/wasm, stable loader, _headers);
      # fails if the gzipped bundle exceeds the 600 KB budget.
      - run: scripts/build-island.sh
      # Markup parity: the island's first frame must equal the server's HTML.
      - run: cargo test -p ghinvite-island
      - run: cargo clippy -p ghinvite-island --target wasm32-unknown-unknown -- -D warnings
      - name: Build production CSS
        working-directory: crates/ghinvite-web
        run: npm ci && npm run build:css
      - name: Install browser tests
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Browser regressions
        working-directory: tests/browser
        run: npm test
      - name: Authoritative admission browser regressions
        working-directory: tests/browser
        run: npx playwright test --config admission.config.mjs
      - name: Document shell browser regressions
        working-directory: tests/browser
        run: npx playwright test --config document.config.mjs
      - name: Console contrast and reflow regressions
        working-directory: tests/browser
        run: npx playwright test --config console-accessibility.config.mjs
      - name: Requester delivery browser regressions
        working-directory: tests/browser
        run: npx playwright test --config delivery.config.mjs
      - name: Request history browser regressions
        working-directory: tests/browser
        run: npx playwright test --config request-history.config.mjs
      - name: No-JavaScript read recovery regressions
        working-directory: tests/browser
        run: npx playwright test --config read-recovery.config.mjs
      - name: No-JavaScript admin mutation recovery regressions
        working-directory: tests/browser
        run: npx playwright test --config mutation-recovery.config.mjs
      - name: Accessible revocation confirmation regressions
        working-directory: tests/browser
        run: npx playwright test --config revocation.config.mjs
      - name: Reissue confirmation and exact retry with and without JavaScript
        working-directory: tests/browser
        run: npx playwright test --config reissue.config.mjs
      - name: Bulk review and exact recovery with and without JavaScript
        working-directory: tests/browser
        run: npx playwright test --config bulk.config.mjs
      - name: Two-app onboarding and confirmed installation requests
        working-directory: tests/browser
        run: npx playwright test --config onboarding.config.mjs
      - name: Link pause browser recovery
        working-directory: tests/browser
        run: npx playwright test --config link-pause.config.mjs
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: island-bundle
          path: dist/public
          if-no-files-found: error

  integration:
    name: Restate approval and delivery gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      # The runner owns the disposable runtime; the test owns loopback GitHub
      # stub/endpoint tasks. Failure diagnostics stay in retained Actions logs.
      - name: Verify authoritative admission, recovery and 500-call lifecycle ordering
        env:
          CI: 'true'
        run: |
          container=$(docker create docker.restate.dev/restatedev/restate:1.8.1@sha256:fea6b4a893616fd8ec4594bd72fbf9967f9ab9242c8c75008de75edfbb58b2c7)
          docker cp "$container:/usr/local/bin/restate-server" "$RUNNER_TEMP/restate-server"
          docker rm "$container"
          RESTATE_SERVER_BIN="$RUNNER_TEMP/restate-server" cargo test --locked -p ghinvite-workflows --features integration --test authoritative_admission -- --test-threads=2
      - name: Verify organization observation and retained authority
        env:
          CI: 'true'
        run: |
          container=$(docker create docker.restate.dev/restatedev/restate:1.8.1@sha256:fea6b4a893616fd8ec4594bd72fbf9967f9ab9242c8c75008de75edfbb58b2c7)
          docker cp "$container:/usr/local/bin/restate-server" "$RUNNER_TEMP/restate-server"
          docker rm "$container"
          RESTATE_SERVER_BIN="$RUNNER_TEMP/restate-server" cargo test --locked -p ghinvite-workflows --features integration --test org_installation_observation --test organization_authority
      - name: Verify mixed dispatch and organization delivery
        env:
          CI: 'true'
        run: RESTATE_SERVER_BIN="$RUNNER_TEMP/restate-server" cargo test --locked -p ghinvite-workflows --features integration --test mixed_dispatch --test organization_delivery --test organization_reconcile --test request_completion --test email_delivery -- --test-threads=1
      - name: Verify request initialization and deadline verdict recovery
        run: bash scripts/test-restate.sh request_owner
      - name: Authenticated invitation journey, settlement and retained recovery
        run: bash scripts/test-restate.sh canonical_link
      - name: Verify retained delivery and uncertain HTTP recovery
        run: bash scripts/test-restate.sh retained_delivery
      - name: Verify approved delivery without projected parents
        run: bash scripts/test-restate.sh approved_delivery
      - name: Verify installation convergence and admission availability
        run: bash scripts/test-restate.sh installation_availability
      - name: Verify one audit event survives a retried installation projection
        run: bash scripts/test-restate.sh installation_audit_replay
      - name: Verify durable projection acknowledgement loss, invariant repair, and complete audit recovery
        run: bash scripts/test-restate.sh durable_projection
