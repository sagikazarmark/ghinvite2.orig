name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  wasm32:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Each crate is built with `-p` on purpose: `cfg(target_arch = "wasm32")`
      # means "Cloudflare Workers" in the Worker crates and "browser" in
      # ghinvite-ui / ghinvite-island, and a `--workspace --target
      # wasm32-unknown-unknown` build would unify features across both (ADR 0001).
      - run: cargo check -p ghinvite-ui --target wasm32-unknown-unknown
      - run: cargo check -p ghinvite-island --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-storage-d1 --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-web-worker --target wasm32-unknown-unknown
      - run: cargo build -p ghinvite-workflows-worker --target wasm32-unknown-unknown

  island:
    name: Island bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The Dioxus CLI as a prebuilt binary: `cargo install dioxus-cli` compiles
      # the CLI from source (~10 min per run, and rust-cache does not cache
      # installed binaries), whereas binstall downloads the release asset in
      # seconds. Pinned to the version the bundle was verified with.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked dioxus-cli@0.7.9
      # dx bundle → dist/public (hashed js/wasm, stable loader, _headers);
      # fails if the gzipped bundle exceeds the 600 KB budget.
      - run: scripts/build-island.sh
      # Markup parity: the island's first frame must equal the server's HTML.
      - run: cargo test -p ghinvite-island
      - run: cargo clippy -p ghinvite-island --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: island-bundle
          path: dist/public
          if-no-files-found: error

  integration:
    name: Restate integration tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    services:
      restate:
        image: docker.restate.dev/restatedev/restate:latest
        ports:
          - 8080:8080
          - 9070:9070
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for Restate
        run: until curl -sf http://localhost:9070/health; do sleep 2; done
      - name: Start github-stub
        run: |
          cargo build -p ghinvite-github --example stub
          ./target/debug/examples/stub --port 3001 &
          until curl -sf http://localhost:3001/calls; do sleep 1; done
      - name: Run integration tests
        run: cargo test -p ghinvite-workflows --features integration -- --ignored
